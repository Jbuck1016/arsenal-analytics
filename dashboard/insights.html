<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insights · MLS 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* pre-paint theme so there is no flash */
(function(){try{var t=localStorage.getItem('theme');if(t==='light')document.documentElement.classList.remove('dark');else document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}})();
</script>
<style>
:root{
  --f-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  --f-body:'Inter',system-ui,sans-serif;
  /* light (warm paper) */
  --bg:#f4f2ea;--panel:#efece2;--panel2:#e7e3d6;
  --line:#dcd6c8;--line2:#c9c2b0;
  --text:#26272b;--dim:#6a6960;--dim2:#8c8a7d;
  --amber:#9c6b1e;--amber-dim:rgba(156,107,30,.10);--amber-line:rgba(156,107,30,.30);
  --green:#2a8560;--red:#c0392b;--blue:#2f6aa8;
}
html.dark:root, html.dark{
  --bg:#080a0e;--panel:#0e1116;--panel2:#141821;
  --line:#1c222c;--line2:#2b333f;
  --text:#e8eef6;--dim:#8794a6;--dim2:#5b6675;
  --amber:#e2b877;--amber-dim:rgba(226,184,119,.10);--amber-line:rgba(226,184,119,.32);
  --green:#3ddc97;--red:#ff5f56;--blue:#5aa9ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
a{color:inherit;text-decoration:none}

/* header */
.sys{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:13px 16px;margin-bottom:16px}
.sys-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 8px var(--green)}
.sys-title{font:700 13px/1 var(--f-mono);letter-spacing:.02em;color:var(--text)}
.sys-title b{color:var(--amber)}
.sys-line{font:500 11px/1.7 var(--f-mono);color:var(--dim);margin-top:8px}
.sys-line b{color:var(--text);font-weight:600}
.spacer{flex:1}
.nav{display:flex;gap:2px}
.nav a{font:600 9.5px/1 var(--f-mono);color:var(--dim);border:1px solid var(--line2);
  border-radius:3px;padding:6px 9px;text-transform:uppercase;letter-spacing:.06em}
.nav a:hover{color:var(--amber);border-color:var(--amber-line)}
.tbtn{cursor:pointer;border:1px solid var(--line2);background:var(--panel2);border-radius:3px;
  width:30px;height:26px;display:grid;place-items:center;color:var(--dim);font-size:13px}
.tbtn:hover{color:var(--amber);border-color:var(--amber-line)}

/* filter */
.filter{display:flex;gap:1px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 18px;width:max-content}
.filter button{background:var(--panel2);border:none;color:var(--dim);font:600 10px/1 var(--f-mono);
  letter-spacing:.05em;text-transform:uppercase;padding:9px 15px;cursor:pointer}
.filter button.on{background:var(--amber-dim);color:var(--amber)}
.controls{display:flex;gap:10px;align-items:center;margin:0 0 18px;flex-wrap:wrap}
.controls .filter{margin:0}
#lgSel,#teamSel{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:3px;
  padding:8px 10px;font:600 10px/1 var(--f-mono);letter-spacing:.04em;cursor:pointer;min-width:190px}
#teamSel:focus{outline:none;border-color:var(--amber-line)}
#teamSel option[data-zero="1"]{color:var(--dim2)}

/* sections */
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 11px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-t{font:700 10px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.sec-b{font:500 10.5px/1.5 var(--f-body);color:var(--dim)}
.sec-n{font:600 9.5px/1 var(--f-mono);color:var(--dim2);margin-left:auto}

/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:14px 15px;
  display:flex;flex-direction:column;gap:8px;transition:border-color .14s,background .14s}
.card:hover{border-color:var(--amber-line);background:var(--panel2)}
.card-h{font:700 13.5px/1.35 var(--f-body);color:var(--text);letter-spacing:-.01em}
.card-d{font:400 12px/1.55 var(--f-body);color:var(--dim)}
.card-note{font:400 11.5px/1.6 var(--f-body);color:var(--dim2);border-left:2px solid var(--amber-line);
  padding-left:9px;margin-top:2px;font-style:italic}
.card-f{display:flex;align-items:center;gap:9px;margin-top:2px;flex-wrap:wrap}
.chip{font:600 9px/1 var(--f-mono);color:var(--dim);border:1px solid var(--line2);
  border-radius:3px;padding:4px 7px;letter-spacing:.02em;white-space:nowrap}
.chip b{color:var(--text)}
.badge{font:600 8.5px/1 var(--f-mono);border-radius:3px;padding:4px 7px;text-transform:uppercase;letter-spacing:.08em}
.badge.high{color:var(--green);border:1px solid color-mix(in srgb,var(--green) 40%,transparent)}
.badge.medium{color:var(--dim);border:1px solid var(--line2)}
.ev{margin-left:auto;font:600 9.5px/1 var(--f-mono);color:var(--amber);border:1px solid var(--amber-line);
  border-radius:3px;padding:5px 8px}
.ev:hover{background:var(--amber-dim)}
.empty{grid-column:1/-1;font:500 11px/1 var(--f-mono);color:var(--dim2);padding:22px 4px;text-align:center}

.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  font:500 10px/1.8 var(--f-mono);color:var(--dim2);display:flex;gap:8px;flex-wrap:wrap}
.foot .sep{color:var(--line2)}
.load{font:500 12px/1 var(--f-mono);color:var(--dim2);padding:40px 0;text-align:center}

/* Selects: the open option list is drawn by the browser on a white base, so a
   translucent surface colour plus light text renders as white on white. Force an
   opaque background and colour the options explicitly. */
select{background-color:var(--bg2,var(--panel,#1a1d24));color:var(--text,#f4f6fb)}
select option,select optgroup{background-color:var(--bg2,var(--panel,#1a1d24));color:var(--text,#f4f6fb)}
</style>
</head>
<body>
<div class="wrap">

  <div class="sys">
    <div class="sys-top">
      <span class="dot"></span>
      <span class="sys-title">MLS 2026 — <b>Insights</b></span>
      <span class="spacer"></span>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="teams.html">Teams</a>
        <a href="search.html">Search</a>
        <a href="players.html">Players</a>
        <a href="sequences.html">Sequences</a>
        <a href="guide.html">Guide</a>
      </nav>
      <div class="tbtn" id="themeBtn" title="Toggle theme">☾</div>
    </div>
    <div class="sys-line" id="sysLine">reading insights…</div>
  </div>

  <div class="controls">
    <div class="filter" id="filter">
      <button data-f="all" class="on">All</button>
      <button data-f="sd">Recruitment</button>
      <button data-f="tactical">Tactical</button>
    </div>
    <select id="lgSel"></select>
    <select id="teamSel"><option value="all">All teams</option></select>
  </div>

  <div id="content"><div class="load">loading…</div></div>

  <div class="foot">
    <span>reads · generated from sequence + chain-role data</span><span class="sep">/</span>
    <span>deterministic · every claim traces to the numbers</span><span class="sep">/</span>
    <span id="footGen"></span>
  </div>

</div>

<script>
const SB='https://xrsilhiffjoulyoqhdmp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhyc2lsaGlmZmpvdWx5b3FoZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Nzc5NDAsImV4cCI6MjEwMDI1Mzk0MH0.3_ccOJi0SBKOwHGxhJL3fsWCSSLoxZumzt-KH4wO8OU';
const HD={'apikey':AK,'Authorization':'Bearer '+AK};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}

async function sbAll(t,p){p=p||{};const PG=1000;let all=[],off=0;
  while(true){const u=new URL(SB+'/rest/v1/'+t);
    Object.keys(p).forEach(function(k){u.searchParams.set(k,p[k])});
    const r=await fetch(u,{headers:Object.assign({},HD,{'Range':off+'-'+(off+PG-1),'Range-Unit':'items'})});
    if(!r.ok)throw new Error(t+' '+r.status);const d=await r.json();
    if(!Array.isArray(d)||!d.length)break;all=all.concat(d);if(d.length<PG)break;off+=PG;}
  return all;}

/* section layout, SD first */
const SECTIONS=[
  {id:'standout', lens:'sd', match:function(d){return d==='standout_profile'},
   title:'Recruitment · Standout profiles',
   blurb:'Players who top their positional pool for a chain role. Shortlist anchors.'},
  {id:'keyman', lens:'sd', match:function(d){return d==='key_man'},
   title:'Recruitment · Key-man risk',
   blurb:'Roles a side leans on one player for, with no close deputy behind him.'},
  {id:'identity', lens:'tactical', match:function(d){return ['sterile_control','vertical_identity','territorial'].indexOf(d)>=0},
   title:'Tactical · Team identity',
   blurb:'How sides control, threaten, and occupy territory.'},
  {id:'style', lens:'tactical', match:function(d){return ['central_funnel','byline_team'].indexOf(d)>=0},
   title:'Tactical · Progression route',
   blurb:'Where each side chooses to move the ball forward.'}
];

function evLink(ins){
  var e=ins.evidence||{};
  if(e.player_id) return '<a class="ev" href="players.html?player='+encodeURIComponent(e.player_id)+'">profile →</a>';
  if(e.team) return '<a class="ev" href="teams.html?team='+encodeURIComponent(e.team)+'">team →</a>';
  return '';
}
function primaryChip(ins){
  var m=ins.metrics||{};
  if(ins.detector==='standout_profile') return '<span class="chip">pool <b>'+esc(m.pool)+'</b></span><span class="chip"><b>'+esc(m.inv)+'</b> inv</span>';
  if(ins.detector==='key_man') return '<span class="chip">share <b>'+esc(m.share_pct)+'%</b></span>';
  if(m.xt_rank) return '<span class="chip">xT rank <b>'+esc(m.xt_rank)+'</b></span>';
  var k=Object.keys(m)[0];
  return k?'<span class="chip">'+esc(k.replace(/_/g,' '))+' <b>'+esc(m[k])+'</b></span>':'';
}
function card(ins){
  return '<div class="card">'
    +'<div class="card-h">'+esc(ins.headline)+'</div>'
    +'<div class="card-d">'+esc(ins.detail)+'</div>'
    +(ins.note?'<div class="card-note">'+esc(ins.note)+'</div>':'')
    +'<div class="card-f">'+primaryChip(ins)
    +'<span class="badge '+esc(ins.confidence)+'">'+esc(ins.confidence)+'</span>'
    +evLink(ins)+'</div>'
    +'</div>';
}

var ALL=[], DIR={}, LEAGUES=[];
var STATE={lens:'all', team:'all',
  league:(function(){try{return localStorage.getItem('leagueScope')||'ALL'}catch(e){return 'ALL'}})()};
function lgOf(t){return (DIR[t]&&DIR[t].league)||'USA-MLS'}
function inLeague(t){return STATE.league==='ALL'||lgOf(t)===STATE.league}

function visible(){
  return ALL.filter(function(d){
    if(STATE.lens!=='all' && d.lens!==STATE.lens) return false;
    if(!inLeague(d.team)) return false;
    if(STATE.team!=='all' && d.team!==STATE.team) return false;
    return true;
  });
}

function render(){
  var rows=visible();
  var host=document.getElementById('content'); host.innerHTML='';
  SECTIONS.forEach(function(s){
    var sub=rows.filter(function(d){return s.match(d.detector)})
                .sort(function(a,b){return (b.score||0)-(a.score||0)});
    if(!sub.length) return;
    var sec=document.createElement('div');
    sec.className='sec';
    sec.innerHTML='<div class="sec-h"><span class="sec-t">'+esc(s.title)+'</span>'
      +'<span class="sec-b">'+esc(s.blurb)+'</span>'
      +'<span class="sec-n">'+sub.length+'</span></div>'
      +'<div class="grid">'+sub.map(card).join('')+'</div>';
    host.appendChild(sec);
  });
  if(!host.children.length){
    var why = STATE.team!=='all'
      ? esc(STATE.team)+' isn\'t flagged by any current detector.<br>'
        +'That means nothing about them sits far enough from the league norm to be worth calling out yet.'
      : 'no insights match this filter.';
    host.innerHTML='<div class="empty">'+why+'</div>';
  }
  var n=rows.length;
  document.getElementById('sysLine').innerHTML =
    '<b>'+n+'</b> read'+(n===1?'':'s')
    + (STATE.team==='all' ? ' across the league' : ' for '+esc(STATE.team))
    + ' \u00b7 regenerated each matchweek';
}

function buildTeamSelect(){
  var counts={};
  ALL.forEach(function(d){ if(d.team&&inLeague(d.team)) counts[d.team]=(counts[d.team]||0)+1; });
  var teams=Object.keys(counts).sort();
  var sel=document.getElementById('teamSel');
  var scoped=ALL.filter(function(d){return inLeague(d.team)}).length;
  sel.innerHTML='<option value="all">All teams ('+scoped+')</option>'
    + teams.map(function(t){
        return '<option value="'+esc(t)+'">'+esc(t)+' ('+counts[t]+')</option>';
      }).join('');
}

document.getElementById('filter').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  STATE.lens=b.dataset.f;
  document.querySelectorAll('#filter button').forEach(function(x){
    x.classList.toggle('on', x.dataset.f===STATE.lens)});
  render();
});
document.getElementById('teamSel').addEventListener('change',function(e){
  STATE.team=e.target.value; render();
});
function buildLeagueSelect(){
  var sel=document.getElementById('lgSel');
  if(!sel) return;
  if(LEAGUES.length<2){sel.style.display='none';return}
  sel.innerHTML='<option value="ALL">All leagues</option>'+
    LEAGUES.map(function(l){
      return '<option value="'+esc(l.league)+'"'+(STATE.league===l.league?' selected':'')+'>'+
        esc(l.display_name)+'</option>'}).join('');
  sel.value=STATE.league;
  sel.addEventListener('change',function(e){
    STATE.league=e.target.value;
    try{localStorage.setItem('leagueScope',STATE.league)}catch(err){}
    STATE.team='all';
    buildTeamSelect(); render();
  });
}

/* theme */
function paintThemeBtn(){document.getElementById('themeBtn').textContent=document.documentElement.classList.contains('dark')?'☀':'☾';}
document.getElementById('themeBtn').addEventListener('click',function(){
  var dark=document.documentElement.classList.toggle('dark');
  try{localStorage.setItem('theme',dark?'dark':'light')}catch(e){}
  paintThemeBtn();
});
document.getElementById('filter').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(b) applyFilter(b.dataset.f);
});

async function init(){
  paintThemeBtn();
  try{
    ALL=await sbAll('insights',{select:'*',order:'score.desc'});
    try{
      var dir=await sbAll('v_team_directory',{select:'team,league'});
      DIR={};dir.forEach(function(d){DIR[d.team]=d});
      var ls=await sbAll('v_league_summary',{select:'league,display_name,matches'});
      LEAGUES=(ls||[]).filter(function(l){return l.matches>0});
      if(STATE.league!=='ALL'&&!LEAGUES.some(function(l){return l.league===STATE.league}))
        STATE.league='ALL';
    }catch(e){LEAGUES=[]}
    buildLeagueSelect();
    buildTeamSelect();
    render();
    var gen = ALL.length && ALL[0].generated_at ? new Date(ALL[0].generated_at) : null;
    document.getElementById('footGen').textContent = gen ? ('built '+gen.toISOString().slice(0,10)) : '';
  }catch(err){
    document.getElementById('content').innerHTML='<div class="empty">could not load insights ('+esc(err.message)+')</div>';
    document.getElementById('sysLine').textContent='load failed';
  }
}
init();
</script>
</body>
</html>
