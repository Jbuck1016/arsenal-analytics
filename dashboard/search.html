<style>
/* Light palette and font tokens are in theme.css; the colour tokens are in
   tokens.css, app family. This page declared the document family's amber and
   its two tints on a :root that could never win, and read neither --blue nor
   --red; all of it is gone. */
html.dark{
  --bg:var(--ground);--panel:var(--surface-raised);--panel2:var(--surface-recessed);
  --line:var(--border-hairline);--line2:var(--border-strong);
  --text:var(--ink-primary);--dim:var(--ink-secondary);--dim2:var(--ink-tertiary);
  --green:var(--state-positive);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}

.sys{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:12px 15px;margin-bottom:14px}
.sys-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.sys-title{font:700 13px/1 var(--f-mono)}
.sys-title b{color:var(--amber)}
.spacer{flex:1}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{font:600 9.5px/1 var(--f-mono);color:var(--dim);border:1px solid var(--line2);
  border-radius:3px;padding:6px 9px;text-transform:uppercase;letter-spacing:.06em}
.nav a:hover{color:var(--amber);border-color:var(--amber-line)}
.tbtn{cursor:pointer;border:1px solid var(--line2);background:var(--panel2);border-radius:3px;
  width:30px;height:26px;display:grid;place-items:center;color:var(--dim);font-size:13px}
.tbtn:hover{color:var(--amber)}
.sys-line{font:500 11px/1.7 var(--f-mono);color:var(--dim);margin-top:7px}
.sys-line b{color:var(--text)}

.ask{display:flex;gap:8px;margin:0 0 14px;align-items:stretch}
#askInput{flex:1 1 auto;min-width:0;background:var(--panel);color:var(--text);
  border:1px solid var(--line2);border-radius:3px;padding:14px 16px;
  font:500 15px/1.3 var(--f-body);text-overflow:ellipsis}
#askInput:focus{outline:none;border-color:var(--amber-line);background:var(--panel2)}
#askInput::placeholder{color:var(--dim2);font-size:14px}

.ans{border:1px solid var(--amber-line);background:var(--panel);border-radius:3px;
  padding:13px 15px;margin:0 0 14px}
.ans-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.ans-t{font:700 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.parse{font:500 10.5px/1.5 var(--f-mono);color:var(--dim)}
.parse b{color:var(--text)}
.how{font:400 11.5px/1.6 var(--f-body);color:var(--dim2);border-left:2px solid var(--line2);
  padding-left:9px;margin:8px 0 2px}
.pn.link{cursor:pointer;border-bottom:1px dotted var(--line2)}
.pn.link:hover{color:var(--amber);border-bottom-color:var(--amber-line)}
.pill{display:inline-block;font:600 9px/1 var(--f-mono);border:1px solid var(--line2);
  border-radius:3px;padding:4px 7px;margin-right:4px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
/* Clearing the answer is an action, so the control is a button. Reset back to
   the plain "clear" text it was as a span. */
.ans .close{margin-left:auto;cursor:pointer;color:var(--dim);font:600 10px var(--f-mono);
  background:none;border:0;padding:0;margin-top:0;margin-bottom:0;margin-right:0}
.ans .close:hover{color:var(--amber)}
.ans .close:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ex{font:500 10.5px/1.7 var(--f-mono);color:var(--dim2);margin:-6px 0 14px}
/* Each example loads itself into the box and runs, so each is a button. A
   button is an atomic inline box, and inheriting the row's 1.7 line-height
   would make it taller than the line it sits on and push the row 1px per line.
   line-height:normal puts the dotted underline back on the same baseline the
   span had. */
.ex button{cursor:pointer;border-bottom:1px dotted var(--line2);
  background:none;border-top:0;border-left:0;border-right:0;padding:0;margin:0;
  font-family:inherit;font-size:inherit;font-weight:inherit;line-height:normal;
  color:inherit;text-align:left;vertical-align:baseline;max-width:100%;white-space:normal}
.ex button:hover{color:var(--amber)}
.ex button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

.side{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:13px 14px;
  position:sticky;top:12px}
@media(max-width:900px){.side{position:static}}
.fg{margin-bottom:15px}
.fg:last-child{margin-bottom:0}
.fl{font:700 9px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber);
  margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fl .hint{color:var(--dim2);letter-spacing:.02em;font-weight:500;text-transform:none;font-size:9.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:600 10px/1 var(--f-mono);color:var(--dim);background:var(--panel2);
  border:1px solid var(--line2);border-radius:3px;padding:6px 9px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--amber-line);color:var(--text)}
.chip.on{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-line)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.row:last-child{margin-bottom:0}
input[type=range]{flex:1;accent-color:var(--amber);height:3px;cursor:pointer}
.val{font:600 10.5px/1 var(--f-mono);color:var(--text);min-width:46px;text-align:right}
select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line2);
  border-radius:3px;padding:7px 8px;font:500 11px/1.2 var(--f-mono);cursor:pointer}
select:focus{outline:none;border-color:var(--amber-line)}
/* The slider column was fixed at 74px, so the value printed on top of the track.
   Label and value now share a line and the slider gets the full width beneath. */
.trait-row{display:block;margin-bottom:11px}
.trait-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px}
.trait-name{font:500 11px/1.3 var(--f-body);color:var(--dim)}
.trait-row.on .trait-name{color:var(--text);font-weight:600}
.trait-row .mini{display:block}
.trait-row input[type=range]{width:100%;height:3px;display:block;margin:0}
.tval{font:600 10px/1 var(--f-mono);color:var(--dim2);white-space:nowrap}
.trait-row.on .tval{color:var(--amber)}
.btn{width:100%;background:var(--panel2);color:var(--dim);border:1px solid var(--line2);
  border-radius:3px;padding:8px;font:600 10px/1 var(--f-mono);letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;margin-top:9px}
/* .btn is width:100% for the sidebar buttons. The ask button sits beside an input,
   so it must size to its own content or it swallows the row. Declared after .btn and
   with two classes so it wins on both source order and specificity. */
button.btn.askbtn{width:auto;flex:0 0 auto;margin-top:0;padding:0 28px;
  font-size:11px;align-self:stretch}
.btn:hover{color:var(--amber);border-color:var(--amber-line)}
.presets{display:flex;flex-direction:column;gap:4px}
.preset{text-align:left;background:transparent;border:1px solid var(--line2);border-radius:3px;
  color:var(--dim);padding:7px 9px;font:500 10.5px/1.3 var(--f-body);cursor:pointer}
.preset:hover{color:var(--amber);border-color:var(--amber-line);background:var(--amber-dim)}

.main{border:1px solid var(--line);background:var(--panel);border-radius:3px;overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mh-t{font:700 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.mh-n{font:600 10px/1 var(--f-mono);color:var(--dim)}
.mh-n b{color:var(--text)}
.sortsel{width:auto;min-width:190px;margin-left:auto}
table{width:100%;border-collapse:collapse}
th{font:700 8.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);
  text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
th.l,td.l{text-align:left}
td{font:500 11.5px/1.35 var(--f-mono);padding:9px 8px;border-bottom:1px solid var(--line);
  text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
.rk{color:var(--dim2);font-size:10px}
.pn{font-family:var(--f-body);font-weight:600;font-size:12.5px}
.tm{color:var(--dim);font-size:10px}
.metric{color:var(--amber);font-weight:700}
.pbar{display:inline-block;width:52px;height:4px;background:var(--line2);border-radius:2px;
  overflow:hidden;vertical-align:middle;margin-left:6px}
.pbar i{display:block;height:100%;background:var(--amber)}
.empty{padding:34px 16px;text-align:center;font:500 11px/1.6 var(--f-mono);color:var(--dim2)}
.foot{margin-top:14px;font:500 10px/1.7 var(--f-mono);color:var(--dim2)}

/* Selects: the open option list is drawn by the browser on a white base, so a
   translucent surface colour plus light text renders as white on white. Force an
   opaque background and colour the options explicitly. */
select{background-color:var(--bg2,var(--panel,#1a1d24));color:var(--text,#f4f6fb)}
select option,select optgroup{background-color:var(--bg2,var(--panel,#1a1d24));color:var(--text,#f4f6fb)}
</style>

<script>
const SB='https://xrsilhiffjoulyoqhdmp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhyc2lsaGlmZmpvdWx5b3FoZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Nzc5NDAsImV4cCI6MjEwMDI1Mzk0MH0.3_ccOJi0SBKOwHGxhJL3fsWCSSLoxZumzt-KH4wO8OU';
const HD={'apikey':AK,'Authorization':'Bearer '+AK};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}

async function sbAll(t,p){p=p||{};const PG=1000;let all=[],off=0;
  while(true){const u=new URL(SB+'/rest/v1/'+t);
    Object.keys(p).forEach(function(k){u.searchParams.set(k,p[k])});
    const r=await fetch(u,{headers:Object.assign({},HD,{'Range':off+'-'+(off+PG-1),'Range-Unit':'items'})});
    if(!r.ok)throw new Error(t+' '+r.status);const d=await r.json();
    if(!Array.isArray(d)||!d.length)break;all=all.concat(d);if(d.length<PG)break;off+=PG;}
  return all;}

async function sbRpc(fn, body){
  const r = await fetch(SB+'/rest/v1/rpc/'+fn, {method:'POST',
    headers:Object.assign({},HD,{'Content-Type':'application/json'}), body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error(fn+' '+r.status);
  return await r.json();
}

const EXAMPLES=[
  'ten players most similar to Cade Cowell',
  'ten players most similar to Cade Cowell in expected threat creation',
  'best left footed right sided wingers at carrying under 24',
  'top 5 centre backs at progressive passing',
  'most creative strikers'
];

function pname(id,nm){
  if(!id) return '<span class="pn">'+esc(nm)+'</span>';
  return '<a class="pn link" href="players.html?player='+encodeURIComponent(id)+'">'+esc(nm)+'</a>';
}
/* =====================================================================
   WHERE THE LEAGUE CONSTRAINT WAS GOING, AND WHY IT IS PARSED HERE NOW.

   "top 5 centre backs at progressive passing in the premier league" returned
   five MLS players. It was not lost between parse and query: this page never
   had a league constraint to lose. Parsing AND querying both happened inside
   the nl_query database function, and the only filters it hands back are
   pool, side, foot, max_age and min_nineties -- no league in either
   direction. The facet UI below was equally league-blind: STATE has no
   league and apply() never filtered on one.

   The database is out of scope this round, so the fix is to stop asking it to
   parse. Everything needed to answer a ranking question is already in the
   browser -- player_search is loaded whole into ROWS, and v_team_directory
   gives team -> league -- so the question is parsed and answered here, where
   the league can actually be applied.

   nl_query still answers similarity, which needs a model this page does not
   have. When it answers, the chips say so.

   EVERY CONSTRAINT APPLIED IS SHOWN, and anything recognised but not
   applicable is stated rather than dropped. A filter that silently does
   nothing is worse than one that is unsupported.
   ===================================================================== */
const LEAGUE_DISPLAY={'ENG-Premier League':'Premier League','ESP-La Liga':'La Liga',
 'GER-Bundesliga':'Bundesliga','ITA-Serie A':'Serie A','FRA-Ligue 1':'Ligue 1','USA-MLS':'MLS'};
/* Longest phrase first, so "la liga" is not eaten by a shorter match. */
const LEAGUE_WORDS=[
 ['premier league','ENG-Premier League'],['premiership','ENG-Premier League'],
 ['the prem','ENG-Premier League'],['epl','ENG-Premier League'],
 ['major league soccer','USA-MLS'],['mls','USA-MLS'],
 ['la liga','ESP-La Liga'],['laliga','ESP-La Liga'],['spain','ESP-La Liga'],['spanish','ESP-La Liga'],
 ['bundesliga','GER-Bundesliga'],['germany','GER-Bundesliga'],['german','GER-Bundesliga'],
 ['serie a','ITA-Serie A'],['italy','ITA-Serie A'],['italian','ITA-Serie A'],
 ['ligue 1','FRA-Ligue 1'],['ligue1','FRA-Ligue 1'],['france','FRA-Ligue 1'],['french','FRA-Ligue 1'],
 ['england','ENG-Premier League'],['english','ENG-Premier League']
];
const POOL_WORDS=[
 ['centre backs','CB'],['center backs','CB'],['centre back','CB'],['center back','CB'],
 ['centre-backs','CB'],['centre-back','CB'],['centrebacks','CB'],['defenders','CB'],['cb','CB'],
 ['full backs','FB'],['fullbacks','FB'],['full back','FB'],['wing backs','FB'],
 ['wingbacks','FB'],['fb','FB'],
 ['central midfielders','CM'],['midfielders','CM'],['midfielder','CM'],['eights','CM'],['cm','CM'],
 ['attacking midfielders','AM'],['attacking midfielder','AM'],['tens','AM'],['am','AM'],
 ['wingers','W'],['winger','W'],['wide forwards','W'],['wide forward','W'],
 ['strikers','ST'],['striker','ST'],['number nines','ST'],['nines','ST'],
 ['forwards','ST'],['forward','ST'],['st','ST']
];
const POOL_LABEL={CB:'Centre-back',FB:'Full-back / wing-back',CM:'Central midfield',
 AM:'Attacking midfield',W:'Wide forward',ST:'Striker'};

/* Metric phrases -> a field on ROWS, obvious English first. */
const METRIC_WORDS=[
 ['progressive passing','prog_cmp_90'],['progressive passes','prog_cmp_90'],
 ['progressive carries','prog_carries_90'],['ball carrying','carrier'],['carrying','carrier'],
 ['chance creation','creator'],['creative','creator'],['creativity','creator'],
 ['key passes','key_pass_90'],['big chances created','bcc_90'],
 ['expected threat','xt_90'],['expected assists','xa_90'],
 ['passes into the box','into_box_90'],['passes into box','into_box_90'],
 ['final third passes','final_third_90'],['through balls','through_90'],['crosses','cross_90'],
 ['box threat','box_threat'],['finishing','finishing'],['goals','goals_90'],
 ['shots','shots_90'],['xg per shot','xg_per_shot'],
 ['defensive actions','def_action_90'],['tackling','tackle_90'],['tackles','tackle_90'],
 ['interceptions','int_90'],['recoveries','recov_90'],['counterpressures','counterpress_90'],
 ['aerials','aerial_90'],['aerial duels','aerial_90'],
 ['dribbling','individual'],['take ons','takeon_90'],['take-ons','takeon_90'],
 ['build up','initiator'],['build-up','initiator'],['vertical passing','vertical'],
 ['ball progression','progressor'],['progression','progressor'],['tempo','hold_secs'],
 ['assists','assist_90'],['xa','xa_90'],['xg','xg_90'],['xt','xt_90']
];

function metricLabel(k){
  var l=null;
  SORTS.forEach(function(g){g[1].forEach(function(m){if(m[0]===k)l=m[1]})});
  if(!l)TRAITS.forEach(function(t){if(t[0]===k)l=t[1]});
  return l||k;
}
/* The trait fields are chain-role scores, not per-90 metrics, and Rank has no
   column for them -- so a handoff link is offered only when the metric is one
   Rank can actually show. */
function isRankMetric(k){
  var ok=false;
  SORTS.forEach(function(g){g[1].forEach(function(m){if(m[0]===k)ok=true})});
  return ok;
}

function parseAsk(qRaw){
  var q=' '+String(qRaw||'').toLowerCase().replace(/[^a-z0-9\s-]/g,' ').replace(/\s+/g,' ')+' ';
  var used=[],out={league:null,pool:null,metric:null,limit:null,maxAge:null,minN:null,
                   side:null,foot:null,unparsed:[]};
  function take(list,key,label){
    for(var i=0;i<list.length;i++){
      var w=' '+list[i][0]+' ';
      if(q.indexOf(w)>=0){out[key]=list[i][1];used.push(label+' "'+list[i][0]+'"');
        q=q.split(w).join(' ');return true}
    }
    return false;
  }
  take(LEAGUE_WORDS,'league','league');
  take(POOL_WORDS,'pool','position');
  take(METRIC_WORDS,'metric','metric');
  var m;
  if((m=q.match(/\b(?:top|best|first)\s+(\d{1,3})\b/)))out.limit=+m[1];
  else if((m=q.match(/\b(\d{1,3})\s+(?:best|top)\b/)))out.limit=+m[1];
  if((m=q.match(/\bunder\s+(\d{2})\b/)))out.maxAge=+m[1];
  if((m=q.match(/\b(?:at least|min|minimum)\s+(\d{1,3})\s*90s?\b/)))out.minN=+m[1];
  if(q.indexOf(' left foot')>=0||q.indexOf(' left footed')>=0)out.foot='L';
  if(q.indexOf(' right foot')>=0||q.indexOf(' right footed')>=0)out.foot='R';
  if(q.indexOf(' left sided')>=0)out.side='L';
  if(q.indexOf(' right sided')>=0)out.side='R';
  out.used=used;
  return out;
}

/* Answer a ranking from ROWS, honouring every constraint the parse found.
   The percentile is computed over the population that survives the filters,
   which is the rule the Rank table follows: the pool is the selection. */
function answerLocally(p){
  var minN=p.minN==null?6:p.minN;
  var applied=[],ignored=[];
  var pop=ROWS.filter(function(r){
    if(p.league&&TLG[r.team]!==p.league)return false;
    if(p.pool&&r.pool!==p.pool)return false;
    if(p.side&&r.side!==p.side)return false;
    if((r.nineties||0)<minN)return false;
    if(p.maxAge!=null&&(r.age_seen==null||r.age_seen>p.maxAge))return false;
    return r[p.metric]!=null;
  });
  if(p.league)applied.push(LEAGUE_DISPLAY[p.league]||p.league);
  if(p.pool)applied.push(POOL_LABEL[p.pool]||p.pool);
  if(p.side)applied.push('side '+p.side);
  if(p.maxAge!=null)applied.push('under '+p.maxAge);
  applied.push('min '+minN+' 90s');
  /* foot is in the vocabulary because the examples use it, and player_search
     carries no footedness column -- so it is NAMED as unapplied rather than
     quietly doing nothing. */
  if(p.foot)ignored.push('preferred foot ('+(p.foot==='L'?'left':'right')+') — not a column in the player index');
  if(p.league&&!Object.keys(TLG).length)ignored.push('league — the team directory did not load');
  var hib=(p.metric!=='hold_secs');
  var good=function(r){return hib?+r[p.metric]:-r[p.metric]};
  var sorted=pop.map(good).sort(function(a,b){return a-b});
  pop.forEach(function(r){
    var v=good(r),lo=0,hi=sorted.length;
    while(lo<hi){var mid=(lo+hi)>>1;if(sorted[mid]<=v)lo=mid+1;else hi=mid}
    r.__pct=sorted.length>1?Math.round(100*lo/sorted.length):100;
  });
  var list=pop.slice().sort(function(a,b){
    if(b.__pct!==a.__pct)return b.__pct-a.__pct;
    if(good(b)!==good(a))return good(b)-good(a);
    return String(a.player_id)<String(b.player_id)?-1:1;
  });
  return {intent:'rank',local:true,metric:p.metric,applied:applied,ignored:ignored,
          population:pop.length,parse:p,
          results:list.slice(0,p.limit||12).map(function(r,i){
            return {rk:i+1,player_id:r.player_id,player:r.player,team:r.team,pos:r.pos,
                    age_seen:r.age_seen,nineties:r.nineties,
                    value:fmt(r[p.metric],p.metric),pct:r.__pct};
          })};
}

/* The handoff. A ranked list is only evidence if you can reach the rest of
   it, so every local answer links into Rank with the same filters applied. */
function rankHref(p){
  var q=['tab=Rank'];
  if(isRankMetric(p.metric))q.push('metric='+encodeURIComponent(p.metric));
  if(p.pool)q.push('pool='+encodeURIComponent(p.pool));
  if(p.league)q.push('league='+encodeURIComponent(p.league));
  if(p.limit)q.push('n='+p.limit);
  return 'players.html?'+q.join('&');
}

function parseLine(d){
  if(d.intent==='similar'){
    const s=d.subject||{};
    return 'Most similar to <b>'+esc(s.player||'')+'</b> ('+esc(s.team||'')+', '+esc(s.pos||'')+')'
      +' · compared on <b>'+esc(d.compared_on||'overall style')+'</b>';
  }
  if(d.local){
    var lb=d.applied.map(function(x){return '<span class="pill">'+esc(x)+'</span>'});
    return 'Ranked on <b>'+esc(metricLabel(d.metric))+'</b> · '+lb.join('')
      +'<span class="pill">'+d.population+' in the pool</span>';
  }
  const f=d.filters||{};
  let bits=[];
  if(f.pool) bits.push('<span class="pill">'+esc(f.pool)+'</span>');
  if(f.side) bits.push('<span class="pill">side '+esc(f.side)+'</span>');
  if(f.foot) bits.push('<span class="pill">'+esc(f.foot)+' foot</span>');
  if(f.max_age) bits.push('<span class="pill">under '+esc(f.max_age)+'</span>');
  bits.push('<span class="pill">min '+esc(f.min_nineties||6)+' 90s</span>');
  return 'Ranked on <b>'+esc(d.ranked_on_label||d.ranked_on||'')+'</b> · '+bits.join('');
}

function renderAsk(d){
  const host=document.getElementById('askOut');
  if(d.error){
    host.innerHTML='<div class="ans"><div class="ans-h"><span class="ans-t">No answer</span>'
      +'<button type="button" class="close" aria-label="Clear this answer and go back to the filters" onclick="clearAsk()">clear ✕</button></div>'
      +'<div class="parse">'+esc(d.error)+'</div></div>';
    return;
  }
  const rows=d.results||[];
  let h='<div class="ans"><div class="ans-h"><span class="ans-t">'
    +(d.intent==='similar'?'Similarity':'Ranking')+'</span>'
    +'<button type="button" class="close" aria-label="Clear this answer and go back to the filters" onclick="clearAsk()">clear ✕</button></div>'
    +'<div class="parse">'+parseLine(d)+'</div>'
    +(d.local
       ? '<div class="how">Percentile is computed across the '+d.population+
         ' players that match these filters, not within a stored pool — '+
         'so it means "against exactly the list you asked for". '+
         '<a class="link" href="'+rankHref(d.parse)+'">Open this in the full Rank table →</a></div>'
       : '')
    +((d.ignored&&d.ignored.length)
       ? '<div class="how"><b>Not applied:</b> '+d.ignored.map(esc).join('; ')+'</div>' : '')
    +(d.explain?'<div class="how">'+esc(d.explain)+'</div>':'');
  if(!rows.length){ h+='<div class="empty">nothing matched that</div></div>'; host.innerHTML=h; return; }

  if(d.intent==='similar'){
    h+='<table><thead><tr><th class="l">#</th><th class="l">Player</th><th class="l">Team</th>'
      +'<th>Pos</th><th>Match</th></tr></thead><tbody>'
      +rows.map(function(r){return '<tr><td class="l rk">'+esc(r.rank)+'</td>'
        +'<td class="l">'+pname(r.player_id,r.player)+'</td>'
        +'<td class="l tm">'+esc(r.team)+'</td><td>'+esc(r.pos||'')+'</td>'
        +'<td class="metric">'+esc(r.sim_pct)+'%</td></tr>'}).join('')
      +'</tbody></table>';
  } else {
    h+='<table><thead><tr><th class="l">#</th><th class="l">Player</th><th class="l">Team</th>'
      +'<th>Pos</th><th>Age</th><th>90s</th><th>Value</th><th>Pct</th></tr></thead><tbody>'
      +rows.map(function(r){return '<tr><td class="l rk">'+esc(r.rk)+'</td>'
        +'<td class="l">'+pname(r.player_id,r.player)+'</td>'
        +'<td class="l tm">'+esc(r.team)+'</td><td>'+esc(r.pos||'')+'</td>'
        +'<td>'+(r.age_seen==null?'—':esc(r.age_seen))+'</td>'
        +'<td>'+(r.nineties==null?'—':esc(r.nineties))+'</td>'
        +'<td class="metric">'+esc(r.value)+'</td>'
        +'<td>'+esc(r.pct)+'</td></tr>'}).join('')
      +'</tbody></table>';
  }
  h+='</div>';
  host.innerHTML=h;
  document.getElementById('facetLayout').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

function clearAsk(){
  document.getElementById('askOut').innerHTML='';
  document.getElementById('facetLayout').style.display='';
  document.getElementById('askInput').value='';
}

async function runAsk(){
  const q=document.getElementById('askInput').value.trim();
  if(!q) return;
  document.getElementById('askOut').innerHTML=
    '<div class="ans"><div class="parse">thinking…</div></div>';
  /* PARSED HERE FIRST. A ranking this page can answer is answered here,
     because this is the only place the league constraint can be applied at
     all. Similarity still goes to the database, which owns that model. */
  const p=parseAsk(q);
  const similar=/\bsimilar\b|\blike\b/.test(q.toLowerCase());
  if(!similar&&p.metric&&ROWS.length){
    try{ renderAsk(answerLocally(p)); }
    catch(e){ document.getElementById('askOut').innerHTML=
      '<div class="ans"><div class="parse">could not run that ('+esc(e.message)+')</div></div>'; }
    return;
  }
  try{
    const d=await sbRpc('nl_query',{q:q,p_limit:12});
    if(d&&!d.error){
      if(p.league)d.ignored=(d.ignored||[]).concat(
        [(LEAGUE_DISPLAY[p.league]||p.league)+' — this answer comes from the database, which has no league filter']);
      if(!similar&&!p.metric)d.ignored=(d.ignored||[]).concat(
        ['no metric recognised in the question, so this page could not rank it locally']);
    }
    renderAsk(d);
  }catch(e){
    document.getElementById('askOut').innerHTML=
      '<div class="ans"><div class="parse">could not run that ('+esc(e.message)+')</div></div>';
  }
}

/* traits = the 11 chain roles; filtering is on within-pool percentile */
const TRAITS=[
  ['progressor','Ball progression'],['creator','Chance creation'],['carrier','Ball carrying'],
  ['box_threat','Box threat'],['finisher','Finishing'],['individual','1v1 dribbling'],
  ['initiator','Build-up initiation'],['bridge','Third-man bridging'],['vertical','Vertical passing'],
  ['support_angle','Diagonal support'],['hold_secs','Tempo (holds ball)']
];

/* sortable metrics, grouped */
const SORTS=[
  ['Threat',[['xt_90','xT per 90'],['xt_carry_90','xT from carries'],['xt_pass_90','xT from passes'],['player_xt','Total chain xT']]],
  ['Carrying',[['prog_carries_90','Progressive carries'],['carry_box_90','Carries into box'],['carries_90','Carries'],['takeon_90','Take-ons'],['mean_carry_m','Avg carry distance']]],
  ['Creation',[['xa_90','xA per 90'],['key_pass_90','Key passes'],['sca_90','Shot-creating actions'],['bcc_90','Big chances created'],['assist_90','Assists']]],
  ['Progression',[['prog_cmp_90','Progressive passes'],['into_box_90','Passes into box'],['final_third_90','Final-third passes'],['through_90','Through balls'],['cross_90','Crosses']]],
  ['Shooting',[['xg_90','xG per 90'],['goals_90','Goals'],['shots_90','Shots'],['xg_per_shot','xG per shot'],['finishing','Finishing over xG']]],
  ['Defending',[['def_action_90','Defensive actions'],['tackle_90','Tackles'],['int_90','Interceptions'],['recov_90','Recoveries'],['counterpress_90','Counterpressures'],['aerial_90','Aerials won']]],
  ['Other',[['nineties','Minutes (90s)'],['age_seen','Age'],['height_cm','Height']]]
];

const POOLS=['CB','FB','CM','AM','W','ST'];
const SIDES=[['L','Left'],['C','Central'],['R','Right']];

// Each shortcut is a real sentence, so clicking one fills the ask bar and shows you the
// query it ran. You can then edit it rather than reverse-engineering the filters.
const PRESETS=[
  {n:'Young progressive centre-backs', q:'best centre backs at progressive passing under 23'},
  {n:'Efficient wide carriers',        q:'best wingers at ball carrying'},
  {n:'Creative eights',                q:'best midfielders at chance creation'},
  {n:'Penalty-box strikers',           q:'best strikers at box threat'},
  {n:'Under-21 breakouts',             q:'best players at expected threat under 21'},
  {n:'Ball-winning midfielders',       q:'best midfielders at tackling'},
  {n:'One-v-one wingers',              q:'best wingers at dribbling'}
];

let ROWS=[],PCT={},TLG={},STATE={leagues:[],pools:[],sides:[],age:40,minN:6,traits:{},sort:'xt_90'};

/* percentile of every numeric field, computed WITHIN position pool */
function buildPct(rows){
  const fields=new Set();
  TRAITS.forEach(function(t){fields.add(t[0])});
  SORTS.forEach(function(g){g[1].forEach(function(m){fields.add(m[0])})});
  const byPool={};
  rows.forEach(function(r){(byPool[r.pool]=byPool[r.pool]||[]).push(r)});
  const out={};
  Object.keys(byPool).forEach(function(pool){
    const list=byPool[pool];
    out[pool]={};
    fields.forEach(function(f){
      const vals=list.map(function(r){return r[f]}).filter(function(v){return v!=null}).sort(function(a,b){return a-b});
      out[pool][f]=vals;
    });
  });
  return out;
}
function pctOf(r,f){
  const vals=(PCT[r.pool]||{})[f];
  const v=r[f];
  if(!vals||!vals.length||v==null)return null;
  let lo=0,hi=vals.length;
  while(lo<hi){const mid=(lo+hi)>>1; if(vals[mid]<v)lo=mid+1;else hi=mid;}
  return Math.round(100*lo/Math.max(1,vals.length-1));
}

function fmt(v,f){
  if(v==null)return '—';
  if(f==='age_seen'||f==='height_cm')return String(v);
  if(f==='nineties')return (+v).toFixed(1);
  if(Math.abs(v)>=100)return (+v).toFixed(0);
  if(Math.abs(v)>=10)return (+v).toFixed(1);
  return (+v).toFixed(2);
}
function sortLabel(k){
  let l=k;SORTS.forEach(function(g){g[1].forEach(function(m){if(m[0]===k)l=m[1]})});return l;
}

function apply(){
  let out=ROWS.filter(function(r){
    if(STATE.leagues.length&&STATE.leagues.indexOf(TLG[r.team])<0)return false;
    if(STATE.pools.length&&STATE.pools.indexOf(r.pool)<0)return false;
    if(STATE.sides.length&&STATE.sides.indexOf(r.side)<0)return false;
    if(STATE.age<40&&(r.age_seen==null||r.age_seen>STATE.age))return false;
    if((r.nineties||0)<STATE.minN)return false;
    for(const t in STATE.traits){
      const need=STATE.traits[t]; if(!need)continue;
      const p=pctOf(r,t); if(p==null||p<need)return false;
    }
    return true;
  });
  const s=STATE.sort;
  out=out.filter(function(r){return r[s]!=null})
         .sort(function(a,b){return b[s]-a[s]});
  render(out);
}

function render(rows){
  document.getElementById('count').innerHTML='<b>'+rows.length+'</b> players';
  const host=document.getElementById('results');
  if(!rows.length){host.innerHTML='<div class="empty">no players match these filters<br>try widening age, minutes, or trait thresholds</div>';return;}
  const s=STATE.sort;
  let h='<table><thead><tr>'
    +'<th class="l">#</th><th class="l">Player</th><th class="l">Team</th><th>Pos</th>'
    +'<th>Age</th><th>90s</th><th>'+esc(sortLabel(s))+'</th><th>Pool pct</th></tr></thead><tbody>';
  rows.slice(0,60).forEach(function(r,i){
    const p=pctOf(r,s);
    h+='<tr>'
      +'<td class="l rk">'+(i+1)+'</td>'
      +'<td class="l"><span class="pn">'+esc(r.player)+'</span></td>'
      +'<td class="l tm">'+esc(r.team)+'</td>'
      +'<td>'+esc(r.pos)+'</td>'
      +'<td>'+(r.age_seen==null?'—':r.age_seen)+'</td>'
      +'<td>'+(r.nineties==null?'—':(+r.nineties).toFixed(1))+'</td>'
      +'<td class="metric">'+fmt(r[s],s)+'</td>'
      +'<td>'+(p==null?'—':p)+'<span class="pbar"><i style="width:'+(p||0)+'%"></i></span></td>'
      +'</tr>';
  });
  h+='</tbody></table>';
  if(rows.length>60)h+='<div class="empty">showing top 60 of '+rows.length+'</div>';
  host.innerHTML=h;
}

/* ---------- UI wiring ---------- */
function chip(label,on){return '<span class="chip'+(on?' on':'')+'" data-v="'+esc(label)+'">'+esc(label)+'</span>'}
function paintChips(){
  /* Only the leagues actually present in the loaded index, so the control can
     never offer a filter that returns nothing. */
  var present={};ROWS.forEach(function(r){var c=TLG[r.team];if(c)present[c]=true});
  document.getElementById('leagueChips').innerHTML=Object.keys(present).sort().map(function(c){
    return '<span class="chip'+(STATE.leagues.indexOf(c)>=0?' on':'')+'" data-v="'+esc(c)+'">'
      +esc(LEAGUE_DISPLAY[c]||c)+'</span>'}).join('')
    ||'<span class="hint">team directory unavailable</span>';
  document.getElementById('poolChips').innerHTML=POOLS.map(function(p){return chip(p,STATE.pools.indexOf(p)>=0)}).join('');
  document.getElementById('sideChips').innerHTML=SIDES.map(function(s){
    return '<span class="chip'+(STATE.sides.indexOf(s[0])>=0?' on':'')+'" data-v="'+s[0]+'">'+s[1]+'</span>'}).join('');
}
function paintTraits(){
  document.getElementById('traits').innerHTML=TRAITS.map(function(t){
    const v=STATE.traits[t[0]]||0;
    return '<div class="trait-row'+(v?' on':'')+'">'
      +'<div class="trait-head"><span class="trait-name">'+esc(t[1])+'</span>'
      +'<span class="tval">'+(v?('top '+(100-v)+'%'):'any')+'</span></div>'
      +'<div class="mini"><input type="range" min="0" max="95" step="5" value="'+v+'" data-t="'+t[0]+'"></div>'
      +'</div>';
  }).join('');
}
function paintSorts(){
  document.getElementById('sortSel').innerHTML=SORTS.map(function(g){
    return '<optgroup label="'+esc(g[0])+'">'+g[1].map(function(m){
      return '<option value="'+m[0]+'"'+(m[0]===STATE.sort?' selected':'')+'>'+esc(m[1])+'</option>'}).join('')+'</optgroup>';
  }).join('');
}
function paintRanges(){
  document.getElementById('ageMax').value=STATE.age;
  document.getElementById('ageMaxV').textContent=STATE.age>=40?'any':STATE.age;
  document.getElementById('minN').value=STATE.minN;
  document.getElementById('minNV').textContent=STATE.minN;
}
function paintAll(){paintChips();paintTraits();paintSorts();paintRanges();apply();}

document.getElementById('leagueChips').addEventListener('click',function(e){
  const c=e.target.closest('.chip'); if(!c)return;
  const v=c.dataset.v,i=STATE.leagues.indexOf(v);
  if(i>=0)STATE.leagues.splice(i,1);else STATE.leagues.push(v);
  paintChips();apply();
});
document.getElementById('poolChips').addEventListener('click',function(e){
  const c=e.target.closest('.chip'); if(!c)return;
  const v=c.dataset.v,i=STATE.pools.indexOf(v);
  if(i>=0)STATE.pools.splice(i,1);else STATE.pools.push(v);
  paintChips();apply();
});
document.getElementById('sideChips').addEventListener('click',function(e){
  const c=e.target.closest('.chip'); if(!c)return;
  const v=c.dataset.v,i=STATE.sides.indexOf(v);
  if(i>=0)STATE.sides.splice(i,1);else STATE.sides.push(v);
  paintChips();apply();
});
document.getElementById('traits').addEventListener('input',function(e){
  const r=e.target; if(r.type!=='range')return;
  const t=r.dataset.t,v=+r.value;
  if(v>0)STATE.traits[t]=v;else delete STATE.traits[t];
  const row=r.closest('.trait-row');
  row.classList.toggle('on',v>0);
  row.querySelector('.tval').textContent=v?('top '+(100-v)+'%'):'any';
  apply();
});
document.getElementById('ageMax').addEventListener('input',function(e){
  STATE.age=+e.target.value;
  document.getElementById('ageMaxV').textContent=STATE.age>=40?'any':STATE.age;apply();
});
document.getElementById('minN').addEventListener('input',function(e){
  STATE.minN=+e.target.value;document.getElementById('minNV').textContent=STATE.minN;apply();
});
document.getElementById('sortSel').addEventListener('change',function(e){STATE.sort=e.target.value;apply();});
document.getElementById('reset').addEventListener('click',function(){
  STATE={leagues:[],pools:[],sides:[],age:40,minN:6,traits:{},sort:'xt_90'};paintAll();
});
document.getElementById('copy').addEventListener('click',function(){
  const rowsEl=document.querySelectorAll('#results tbody tr');
  let txt='';
  rowsEl.forEach(function(tr){
    const c=tr.querySelectorAll('td');
    txt+=[c[1].innerText,c[2].innerText,c[3].innerText,c[4].innerText,c[6].innerText].join('\t')+'\n';
  });
  navigator.clipboard.writeText(txt).then(function(){
    const b=document.getElementById('copy');b.textContent='Copied';setTimeout(function(){b.textContent='Copy shortlist'},1400);
  }).catch(function(){});
});
document.getElementById('presets').innerHTML=PRESETS.map(function(p,i){
  return '<button class="preset" data-i="'+i+'">'+esc(p.n)+'</button>'}).join('');
document.getElementById('presets').addEventListener('click',function(e){
  const b=e.target.closest('.preset'); if(!b)return;
  const q=PRESETS[+b.dataset.i].q;
  const inp=document.getElementById('askInput');
  inp.value=q;
  inp.focus();
  runAsk();
});
function paintThemeBtn(){document.getElementById('themeBtn').textContent=FutTheme.isDark()?'☀':'☾';}
document.getElementById('themeBtn').addEventListener('click',function(){FutTheme.toggle();});
FutTheme.onChange(paintThemeBtn);

document.addEventListener('DOMContentLoaded',function(){});
async function init(){
  paintThemeBtn();
  document.getElementById('askGo').addEventListener('click',runAsk);
  document.getElementById('askInput').addEventListener('keydown',function(e){
    if(e.key==='Enter') runAsk();
  });
  document.getElementById('askOut').insertAdjacentHTML('beforebegin',
    '<div class="ex" id="exRow">try: '+EXAMPLES.map(function(x){
      return '<button type="button" aria-label="Run the example search: '+esc(x)+'"'
        +' onclick="document.getElementById(\'askInput\').value=this.textContent;runAsk()">'
        +esc(x)+'</button>'}).join(' · ')+'</div>');
  try{
    /* THE TEAM -> LEAGUE MAP. This page had none, which is the whole of why
       a league constraint could not be applied here even when it was typed.
       Its own failure is survivable: without it, a league filter finds nothing
       and says so, rather than silently matching everything. */
    var _tl;
    [ROWS,_tl]=await Promise.all([
      sbAll('player_search',{select:'*'}),
      sbAll('v_team_directory',{select:'team,league'}).catch(function(){return []})
    ]);
    (_tl||[]).forEach(function(d){TLG[d.team]=d.league});
    PCT=buildPct(ROWS);
    const withAge=ROWS.filter(function(r){return r.age_seen!=null}).length;
    document.getElementById('sysLine').innerHTML=
      '<b>'+ROWS.length+'</b> outfield players · <b>'+withAge+'</b> with age · '
      +'traits ranked within position pool · min 6 nineties by default';
    document.getElementById('foot').textContent=
      'Percentiles in this table are computed within position pool. '
      +'The ask bar above computes them across exactly the population it filtered to, '
      +'which is why its numbers can differ from these. '
      +'Age is a snapshot at match time, not date of birth.';
    paintAll();
  }catch(err){
    document.getElementById('results').innerHTML='<div class="empty">could not load index ('+esc(err.message)+')</div>';
    document.getElementById('sysLine').textContent='load failed';
  }
}
init();
</script>
