<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<script>(function(){try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.remove('dark')}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Model laboratory · FutScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap" rel="stylesheet">
<script src="gate.js"></script>
<script src="model-lab-data.js"></script>
<style>
:root{--bg:#e8e4da;--paper:#f6f2e8;--ink:#111820;--muted:#68717a;--line:#c5bfb1;--acid:#d4542b;--cyan:#087f8c;--green:#16724d;--amber:#aa6a12;--red:#b63131;--sans:'IBM Plex Sans Condensed',sans-serif;--serif:'Newsreader',serif;--mono:'IBM Plex Mono',monospace}
html.dark{--bg:#091016;--paper:#111b23;--ink:#eef0e9;--muted:#92a0aa;--line:#293640;--acid:#ff7042;--cyan:#44cad6;--green:#43cf91;--amber:#f2b34e;--red:#ff675f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);background-image:linear-gradient(90deg,color-mix(in srgb,var(--line) 18%,transparent) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 12%,transparent) 1px,transparent 1px);background-size:42px 42px}
.shell{max-width:1500px;margin:auto;padding:22px 24px 80px}.mast{display:grid;grid-template-columns:1fr auto;gap:24px;border-top:5px solid var(--acid);padding-top:16px}.kicker,.micro{font:600 10px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acid)}h1{font:700 clamp(38px,6vw,76px)/.82 var(--serif);letter-spacing:-.05em;margin:10px 0 0}.lede{max-width:720px;font-size:14px;line-height:1.55;color:var(--muted);margin:15px 0 0}.actions{display:flex;gap:7px;align-items:flex-start}.action{background:var(--paper);border:1px solid var(--line);color:var(--muted);text-decoration:none;padding:9px 11px;font:600 9px/1 var(--mono);text-transform:uppercase;cursor:pointer}.action:hover{border-color:var(--acid);color:var(--ink)}
.rail{display:grid;grid-template-columns:repeat(5,1fr);margin:25px 0 18px;border:1px solid var(--line);background:var(--paper)}.stat{padding:14px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{display:block;font:700 23px/1 var(--mono)}.stat span{display:block;margin-top:7px;font:500 9px/1.3 var(--mono);color:var(--muted);text-transform:uppercase}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);padding:9px 0}.tab{border:1px solid var(--line);background:var(--paper);color:var(--muted);font:600 9px/1 var(--mono);padding:9px 12px;text-transform:uppercase;cursor:pointer}.tab.on{background:var(--acid);border-color:var(--acid);color:#fff}.view{display:none}.view.on{display:block;animation:appear .28s ease}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.panel{grid-column:span 6;background:var(--paper);border:1px solid var(--line);padding:17px;min-width:0}.panel.wide{grid-column:1/-1}.panel.third{grid-column:span 4}.ph{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}.ph h2{font:700 20px/1 var(--serif);margin:0}.ph span{font:500 9px/1 var(--mono);color:var(--muted);text-transform:uppercase}.copy{font-size:13px;line-height:1.55;color:var(--muted)}
.bars{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:minmax(130px,1fr) 4fr 58px;gap:9px;align-items:center;font:500 10px/1.2 var(--mono)}.track{height:9px;background:var(--bg);position:relative}.fill{position:absolute;inset:0 auto 0 0;background:var(--cyan)}.fill.control{background:var(--muted);opacity:.5}.value{text-align:right}.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px}.pair .track{height:7px}
.folds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fold{border:1px solid var(--line);padding:13px}.fold h3{font:600 11px/1.3 var(--mono);margin:0 0 12px}.metric{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dotted var(--line);font:500 10px/1.2 var(--mono)}.metric em{font-style:normal;color:var(--green)}
.heat{display:grid;grid-template-columns:1.35fr repeat(4,1fr);font:500 9px/1.2 var(--mono);border-top:1px solid var(--line);border-left:1px solid var(--line)}.heat>*{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.heat .head{color:var(--muted);text-transform:uppercase}.heat .cell{background:color-mix(in srgb,var(--cyan) calc(var(--heat)*1%),transparent)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:transparent;color:var(--muted);font:600 8px/1 var(--mono);padding:7px 9px;text-transform:uppercase;cursor:pointer}.chip.on{border-color:var(--cyan);color:var(--cyan)}.feature-table{max-height:550px;overflow:auto}.frow{display:grid;grid-template-columns:minmax(220px,1.8fr) 110px 3fr 55px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font:500 9px/1.3 var(--mono)}.coef{height:13px;position:relative;background:linear-gradient(90deg,transparent 49.7%,var(--line) 50%,transparent 50.3%)}.coef span{position:absolute;height:5px;top:4px;background:var(--cyan)}.coef span.neg{background:var(--acid)}.family{color:var(--muted);text-transform:uppercase}
.select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px;font:500 11px/1 var(--mono);margin-bottom:15px}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.club{font:700 24px/1 var(--serif)}.xg{font:600 24px/1 var(--mono);color:var(--acid)}.prob-line{display:grid;grid-template-columns:70px 1fr 55px;gap:10px;align-items:center;margin:9px 0;font:500 9px/1 var(--mono)}.prob-line .track{height:17px}.driver{padding:10px 0;border-top:1px solid var(--line)}.driver strong{font:600 10px/1.2 var(--mono);text-transform:uppercase}.driver span{float:right;color:var(--acid)}.driver p{font-size:11px;color:var(--muted);margin:5px 0 0}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.input{background:var(--bg);padding:10px}.input b{display:block;font:600 15px/1 var(--mono)}.input span{font:500 8px/1.25 var(--mono);color:var(--muted);text-transform:uppercase}
.drift-row{display:grid;grid-template-columns:2fr 70px repeat(3,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font:500 9px/1.3 var(--mono)}.tag{font:600 8px/1 var(--mono);padding:4px 6px;text-transform:uppercase;width:max-content}.tag.stable{color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}.tag.moderate{color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}.tag.severe{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}.empty{padding:25px;border:1px dashed var(--line);color:var(--muted);text-align:center}.guard{border-left:3px solid var(--cyan);padding:12px 14px;background:color-mix(in srgb,var(--cyan) 7%,var(--paper));font:500 11px/1.6 var(--mono);color:var(--muted)}
@keyframes appear{from{opacity:0;transform:translateY(5px)}}@media(max-width:900px){.rail{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}.panel,.panel.third{grid-column:1/-1}.folds{grid-template-columns:1fr}.frow{grid-template-columns:1.5fr 90px 2fr 45px}}@media(max-width:620px){.shell{padding:15px 11px 50px}.mast{grid-template-columns:1fr}.rail{grid-template-columns:1fr 1fr}.stat b{font-size:18px}.match-grid{grid-template-columns:1fr}.inputs{grid-template-columns:1fr 1fr}.drift-row{grid-template-columns:1.6fr 65px 1fr}.drift-row>*:nth-child(4),.drift-row>*:nth-child(5){display:none}}
</style>
</head>
<body><main class="shell">
<header class="mast"><div><div class="kicker">FutScout · private research desk</div><h1>The model<br>under glass.</h1><p class="lede">Interrogate what the model knows, what moved a forecast, where it improved, and where it is still uncertain. This room is diagnostic and deliberately cannot promote or activate a model.</p></div><div class="actions"><a class="action" href="model-review.html">forecasts →</a><a class="action" href="index.html">analytics</a><button class="action" id="theme">light / dark</button></div></header>
<section class="rail" id="rail"></section>
<nav class="tabs" id="tabs" aria-label="Model lab sections"></nav>
<section class="view on" id="overview"></section>
<section class="view" id="validation"></section>
<section class="view" id="features"></section>
<section class="view" id="matches"></section>
<section class="view" id="monitoring"></section>
</main><script>
const D=window.MODEL_LAB_DATA; const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const n=(v,d=3)=>v==null?'—':Number(v).toFixed(d); const pct=v=>v==null?'—':(100*Number(v)).toFixed(1)+'%';
if(!D)document.body.innerHTML='<div class="empty">Model lab data is unavailable.</div>';else boot();
function boot(){
 const m=D.model,s=D.shadow,dr=D.drift; document.getElementById('rail').innerHTML=[['SHADOW','lifecycle','good'],[m.feature_count,'model inputs',''],[m.training_match_count.toLocaleString(),'training matches',''],[s.resolved||0,'live calls scored',s.sample_gate?.ready?'good':'warn'],[dr.current_matches||0,'current matches monitored',dr.sample_ready?'good':'warn']].map(x=>`<div class="stat"><b class="${x[2]}">${x[0]}</b><span>${x[1]}</span></div>`).join('');
 const views=['overview','validation','features','matches','monitoring'];document.getElementById('tabs').innerHTML=views.map((v,i)=>`<button class="tab ${i?'':'on'}" data-view="${v}">${v}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(e=>e.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.view).classList.add('on')});
 document.getElementById('theme').onclick=()=>{document.documentElement.classList.toggle('dark');try{localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')}catch(e){}};
 renderOverview();renderValidation();renderFeatures();renderMatches();renderMonitoring();
}
function panel(title,stamp,body,cls=''){return `<article class="panel ${cls}"><div class="ph"><h2>${title}</h2><span>${stamp}</span></div>${body}</article>`}
function renderOverview(){const m=D.model;document.getElementById('overview').innerHTML=`<div class="grid">${panel('Current specimen','registered model',`<div class="micro">${esc(m.display_version)}</div><p class="copy">${esc(m.decision_basis)}</p><div class="metric"><span>Algorithm</span><b>${esc(m.algorithm)}</b></div><div class="metric"><span>Training seasons</span><b>${m.training_seasons.join(' · ')}</b></div><div class="metric"><span>Trained through</span><b>${m.trained_through}</b></div><div class="metric"><span>Feature schema</span><b>v${m.feature_schema_version}</b></div>`)}${panel('Promotion boundary','read only',`<div class="guard">${esc(D.guardrails.note)}<br><br>Live scoring gate: <b>${esc(D.shadow.sample_gate?.decision||'collect_more_results')}</b>. No button on this page can change lifecycle state.</div>`)}${panel('Holdout result','lower is better',`<div class="metric"><span>V2 mean log loss</span><b class="good">${n(m.mean_log_loss,6)}</b></div><div class="metric"><span>Compact control</span><b>${n(m.control_mean_log_loss,6)}</b></div><div class="metric"><span>Relative improvement</span><b class="good">${pct((m.control_mean_log_loss-m.mean_log_loss)/m.control_mean_log_loss)}</b></div><p class="copy">Small improvements matter only when they repeat out of season. This challenger beat the control on both chronological holdouts.</p>`,'third')}${panel('Feature families','29 selected inputs',familySummary(),'third')}${panel('What comes next','research queue',`<div class="metric"><span>01</span><b>Accumulate real frozen calls</b></div><div class="metric"><span>02</span><b>Review calibration by league</b></div><div class="metric"><span>03</span><b>Challenge with xT, xG and touch families</b></div><div class="metric"><span>04</span><b>Promote only after sample gate</b></div>`,'third')}</div>`}
function familySummary(){const counts={};D.features.forEach(f=>counts[f.family]=(counts[f.family]||0)+1);return Object.entries(counts).map(([k,v])=>`<div class="metric"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}
function renderValidation(){const max=Math.max(...D.candidate_ranking.map(r=>r.mean_log_loss));const candidates=D.candidate_ranking.map(r=>`<div class="barrow"><span>${r.rank}. ${esc(r.name.replaceAll('_',' '))}</span><div class="track"><span class="fill ${r.name==='current_compact_control'?'control':''}" style="width:${r.mean_log_loss/max*100}%"></span></div><span class="value">${n(r.mean_log_loss,5)}</span></div>`).join('');const folds=D.validation_folds.map(f=>`<div class="fold"><h3>${esc(f.name.replaceAll('_',' → '))}</h3>${['log_loss','brier','calibration_error','home_goals_mae','away_goals_mae'].map(k=>`<div class="metric"><span>${k.replaceAll('_',' ')}</span><span>V2 <em>${n(f.candidate[k],4)}</em> · ctrl ${n(f.control[k],4)}</span></div>`).join('')}</div>`).join('');document.getElementById('validation').innerHTML=`<div class="grid">${panel('Candidate bench','chronological mean log loss',`<div class="bars">${candidates}</div>`,'wide')}${panel('Out-of-season folds','V2 vs control',`<div class="folds">${folds}</div>`,'wide')}${panel('League diagnostics','latest holdout',leagueHeat(),'wide')}</div>`}
function leagueHeat(){const f=D.validation_folds[D.validation_folds.length-1],rows=Object.entries(f.by_league);return `<div class="heat"><div class="head">league</div><div class="head">accuracy</div><div class="head">log loss</div><div class="head">calibration</div><div class="head">matches</div>${rows.map(([l,x])=>`<div>${esc(l.replace('ENG-','').replace('ESP-','').replace('ITA-','').replace('GER-','').replace('FRA-',''))}</div><div class="cell" style="--heat:${x.accuracy*100}">${pct(x.accuracy)}</div><div>${n(x.log_loss,3)}</div><div>${n(x.calibration_error,3)}</div><div>${x.matches}</div>`).join('')}</div>`}
function renderFeatures(){const families=['all',...new Set(D.coefficients.map(r=>r.family))];const selected=new Set(D.features.map(f=>f.feature.replace(/^team\.|^opponent\./,'').replace(/_(3|5|10)$/,''))),queue=Object.entries(D.research_queue.catalog).map(([family,items])=>`<div class="fold"><h3>${esc(family.replaceAll('_',' '))}</h3>${items.map(x=>`<div class="metric"><span>${esc(x.replaceAll('_',' '))}</span><b class="${selected.has(x)?'good':'warn'}">${selected.has(x)?'IN V2':'RESEARCH'}</b></div>`).join('')}</div>`).join('');document.getElementById('features').innerHTML=`<div class="grid">${panel('Coefficient explorer','standardized model scale',`<div class="filters" id="featureFilters">${families.map((f,i)=>`<button class="chip ${i?'':'on'}" data-family="${esc(f)}">${esc(f)}</button>`).join('')}</div><div class="feature-table" id="featureRows"></div><p class="copy">Direction is shown for the home-goal equation. Coefficients describe model association after preprocessing—not standalone football causality.</p>`,'wide')}${panel('Feature research queue','selected vs awaiting coverage',`<div class="folds">${queue}</div><p class="copy">xT, xG, final-third touches, sequence quality, progression and pressing are tracked here even when historical coverage prevents them from entering the deployed challenger. “Research” means test when coverage passes—not silently discard.</p>`,'wide')}</div>`;document.querySelectorAll('#featureFilters .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#featureFilters .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderFeatureRows(b.dataset.family)});renderFeatureRows('all')}
function renderFeatureRows(family){const rows=D.coefficients.filter(r=>family==='all'||r.family===family).slice(0,80),mx=Math.max(...rows.map(r=>r.magnitude),.001);document.getElementById('featureRows').innerHTML=rows.map(r=>{const v=r.home_goal_coefficient||0,w=Math.abs(v)/mx*50,left=v<0?50-w:50;return `<div class="frow"><span>${esc(r.feature.replace('numeric__','').replace('categorical__',''))}</span><span class="family">${esc(r.family)}</span><div class="coef"><span class="${v<0?'neg':''}" style="left:${left}%;width:${w}%"></span></div><span>${v>=0?'+':''}${n(v,3)}</span></div>`}).join('')}
function renderMatches(){const opts=D.predictions.sort((a,b)=>a.date.localeCompare(b.date)).map((r,i)=>`<option value="${i}">${new Date(r.date).toLocaleDateString()} · ${esc(r.home_team)} — ${esc(r.away_team)}</option>`).join('');document.getElementById('matches').innerHTML=`<div class="grid">${panel('Forecast dissection','select a match',`<select class="select" id="matchSelect">${opts}</select><div id="matchDetail"></div>`,'wide')}</div>`;document.getElementById('matchSelect').onchange=e=>renderMatch(Number(e.target.value));renderMatch(0)}
function renderMatch(i){const r=D.predictions[i];if(!r){document.getElementById('matchDetail').innerHTML='<div class="empty">No explained predictions.</div>';return}const e=r.explanation,ps=[['HOME',r.home_win_probability],['DRAW',r.draw_probability],['AWAY',r.away_win_probability]];document.getElementById('matchDetail').innerHTML=`<div class="match-grid"><div><div class="club">${esc(r.home_team)}</div><div class="xg">${n(r.home_expected_goals,2)} xG</div></div><div><div class="club">${esc(r.away_team)}</div><div class="xg">${n(r.away_expected_goals,2)} xG</div></div></div><p class="copy">${esc(e.summary)}</p>${ps.map(p=>`<div class="prob-line"><span>${p[0]}</span><div class="track"><span class="fill" style="width:${p[1]*100}%"></span></div><b>${pct(p[1])}</b></div>`).join('')}<div class="ph" style="margin-top:22px"><h2>Evidence ledger</h2><span>actual inputs</span></div><div class="inputs">${Object.entries(e.inputs).map(([k,v])=>`<div class="input"><b>${v==null?'—':esc(v)}</b><span>${esc(k.replaceAll('_',' '))}</span></div>`).join('')}</div><div class="ph" style="margin-top:22px"><h2>Directional drivers</h2><span>goal-balance contribution</span></div>${e.drivers.map(d=>`<div class="driver"><strong>${esc(d.label)} · ${esc(d.strength)}</strong><span>${d.goal_balance_effect>=0?'+':''}${n(d.goal_balance_effect,3)}</span><p>Favors ${esc(d.favors)}. ${esc(d.detail)}</p></div>`).join('')}<p class="copy">${esc(e.method)} ${esc(e.scope)}</p>`}
function renderMonitoring(){const d=D.drift,s=D.shadow;const drift=d.features.map(r=>`<div class="drift-row"><span>${esc(r.feature)}</span><span class="tag ${r.severity}">${r.severity}</span><span>PSI ${n(r.population_stability_index,3)}</span><span>shift ${n(r.standardized_mean_shift,3)}</span><span>missing Δ ${n(r.missing_rate_change,3)}</span></div>`).join('');const leagues=Object.entries(s.by_league||{}).map(([l,x])=>`<div class="metric"><span>${esc(l)}</span><b>${x.matches||0} scored${x.log_loss!=null?' · LL '+n(x.log_loss,3):''}</b></div>`).join('');document.getElementById('monitoring').innerHTML=`<div class="grid">${panel('Live shadow score','real predictions only',`<div class="metric"><span>Resolved</span><b>${s.resolved||0}</b></div><div class="metric"><span>Pending</span><b>${s.pending||0}</b></div><div class="metric"><span>Gate</span><b class="${s.sample_gate?.ready?'good':'warn'}">${esc(s.sample_gate?.decision||'collect_more_results')}</b></div>${leagues||'<div class="empty">Waiting for the first eligible frozen slate to resolve.</div>'}`)}${panel('Current-season drift','diagnostic, not guilt',`<div class="metric"><span>Decision</span><b class="${d.decision==='no_material_drift_detected'?'good':'warn'}">${esc(d.decision)}</b></div><div class="metric"><span>Current sample</span><b>${d.current_matches} matches</b></div><p class="copy">Calendar effects can legitimately differ early in a season. Severe rest-day drift is reviewed separately from football-performance drift.</p>`)}${panel('Feature drift ledger','phase-matched reference',`<div class="drift-row"><b>feature</b><b>status</b><b>PSI</b><b>mean shift</b><b>missing</b></div>${drift}`,'wide')}</div>`}
</script></body></html>
