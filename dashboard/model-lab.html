<style>
:root{--bg:#e9e5dc;--paper:#fffdf6;--ink:#101820;--muted:#45535e;--line:#aaa394;--acid:#c9431d;--cyan:#006f79;--green:#086843;--amber:#8b5500;--red:#a82424;--sans:'IBM Plex Sans Condensed',sans-serif;--serif:'Newsreader',serif;--mono:'IBM Plex Mono',monospace;--scale:1}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(16px * var(--scale));background-image:linear-gradient(90deg,color-mix(in srgb,var(--line) 15%,transparent) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 10%,transparent) 1px,transparent 1px);background-size:42px 42px}
.shell{max-width:1320px;margin:auto;padding:28px 30px 90px}.mast{display:grid;grid-template-columns:1fr auto;gap:30px;border-top:6px solid var(--acid);padding-top:19px}.kicker,.micro{font:700 calc(11px * var(--scale))/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acid)}h1{font:700 clamp(46px,6vw,78px)/.84 var(--serif);letter-spacing:-.05em;margin:10px 0 0}.lede{max-width:790px;font-size:calc(17px * var(--scale));line-height:1.6;color:var(--muted);margin:18px 0 0}.actions{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.action{background:var(--paper);border:1px solid var(--line);color:var(--ink);text-decoration:none;padding:11px 13px;font:700 calc(11px * var(--scale))/1 var(--mono);text-transform:uppercase;cursor:pointer}.action:hover,.action:focus{border-color:var(--acid);outline:2px solid color-mix(in srgb,var(--acid) 28%,transparent);outline-offset:2px}
.rail{display:grid;grid-template-columns:repeat(5,1fr);margin:30px 0 19px;border:1px solid var(--line);background:var(--paper)}.stat{padding:18px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{display:block;font:700 calc(25px * var(--scale))/1 var(--mono)}.stat span{display:block;margin-top:9px;font:600 calc(11px * var(--scale))/1.4 var(--mono);color:var(--muted);text-transform:uppercase}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);padding:11px 0}.tab{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:700 calc(11px * var(--scale))/1 var(--mono);padding:11px 14px;text-transform:uppercase;cursor:pointer}.tab.on{background:var(--acid);border-color:var(--acid);color:#fff}.view{display:none}.view.on{display:block;animation:appear .28s ease}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.panel{grid-column:span 6;background:var(--paper);border:1px solid var(--line);padding:23px;min-width:0}.panel.wide{grid-column:1/-1}.panel.third{grid-column:span 4}.ph{display:flex;justify-content:space-between;gap:16px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:17px}.ph h2{font:700 calc(24px * var(--scale))/1 var(--serif);margin:0}.ph span{font:600 calc(10px * var(--scale))/1.2 var(--mono);color:var(--muted);text-transform:uppercase}.copy{font-size:calc(15px * var(--scale));line-height:1.65;color:var(--muted)}
.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:minmax(190px,1.4fr) 3fr 86px;gap:12px;align-items:center;font:600 calc(12px * var(--scale))/1.35 var(--mono)}.track{height:12px;background:var(--bg);position:relative}.fill{position:absolute;inset:0 auto 0 0;background:var(--cyan)}.fill.control{background:var(--muted);opacity:.65}.value{text-align:right}.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px}.pair .track{height:7px}
.folds{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.fold{border:1px solid var(--line);padding:17px}.fold h3{font:700 calc(13px * var(--scale))/1.4 var(--mono);margin:0 0 14px}.metric{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-top:1px dotted var(--line);font:600 calc(12px * var(--scale))/1.35 var(--mono)}.metric em{font-style:normal;color:var(--green)}
.heat{display:grid;grid-template-columns:1.35fr repeat(4,1fr);font:500 9px/1.2 var(--mono);border-top:1px solid var(--line);border-left:1px solid var(--line)}.heat>*{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.heat .head{color:var(--muted);text-transform:uppercase}.heat .cell{background:color-mix(in srgb,var(--cyan) calc(var(--heat)*1%),transparent)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:700 calc(10px * var(--scale))/1 var(--mono);padding:9px 11px;text-transform:uppercase;cursor:pointer}.chip.on{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 10%,transparent);color:var(--cyan)}.feature-table{max-height:620px;overflow:auto}.frow{display:grid;grid-template-columns:minmax(230px,1.8fr) 130px 3fr 70px;gap:13px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font:600 calc(11px * var(--scale))/1.4 var(--mono)}.coef{height:16px;position:relative;background:linear-gradient(90deg,transparent 49.7%,var(--line) 50%,transparent 50.3%)}.coef span{position:absolute;height:8px;top:4px;background:var(--cyan)}.coef span.neg{background:var(--acid)}.family{color:var(--muted);text-transform:uppercase}
.select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:13px;font:600 calc(13px * var(--scale))/1 var(--mono);margin-bottom:18px}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.club{font:700 calc(29px * var(--scale))/1 var(--serif)}.xg{font:700 calc(27px * var(--scale))/1 var(--mono);color:var(--acid)}.prob-line{display:grid;grid-template-columns:78px 1fr 65px;gap:12px;align-items:center;margin:12px 0;font:700 calc(12px * var(--scale))/1 var(--mono)}.prob-line .track{height:20px}.driver{padding:14px 0;border-top:1px solid var(--line)}.driver strong{font:700 calc(12px * var(--scale))/1.3 var(--mono);text-transform:uppercase}.driver span{float:right;color:var(--acid)}.driver p{font-size:calc(14px * var(--scale));line-height:1.5;color:var(--muted);margin:7px 0 0}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.input{background:var(--bg);padding:13px}.input b{display:block;font:700 calc(18px * var(--scale))/1 var(--mono)}.input span{font:600 calc(10px * var(--scale))/1.35 var(--mono);color:var(--muted);text-transform:uppercase}
.drift-row{display:grid;grid-template-columns:2fr 80px repeat(3,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font:600 calc(11px * var(--scale))/1.4 var(--mono)}.tag{font:700 calc(9px * var(--scale))/1 var(--mono);padding:5px 7px;text-transform:uppercase;width:max-content}.tag.stable{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}.tag.moderate{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}.tag.severe{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}.empty{padding:28px;border:1px dashed var(--line);color:var(--muted);text-align:center}.guard,.explain{border-left:4px solid var(--cyan);padding:16px 18px;background:color-mix(in srgb,var(--cyan) 8%,var(--paper));font:600 calc(13px * var(--scale))/1.65 var(--sans);color:var(--ink)}.orientation{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:13px}.question{padding:20px;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--cyan)}.question b{display:block;font:700 calc(20px * var(--scale))/1.1 var(--serif);margin:7px 0 10px}.question p{margin:0;color:var(--muted);font-size:calc(14px * var(--scale));line-height:1.55}.step{font:700 calc(10px * var(--scale))/1 var(--mono);color:var(--acid);text-transform:uppercase;letter-spacing:.08em}.verdict{padding:20px;background:color-mix(in srgb,var(--green) 9%,var(--paper));border:1px solid var(--green)}.verdict h3{font:700 calc(28px * var(--scale))/1 var(--serif);margin:5px 0 9px}.model-table{width:100%;border-collapse:collapse;font:600 calc(12px * var(--scale))/1.4 var(--mono)}.model-table th,.model-table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}.model-table th{color:var(--muted);text-transform:uppercase;font-size:.9em}.model-table tr.winner{background:color-mix(in srgb,var(--green) 10%,transparent)}.delta-better{color:var(--green)}.delta-worse{color:var(--red)}.plain{font-family:var(--sans);font-size:calc(14px * var(--scale));line-height:1.5}.glossary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.definition{padding:15px;background:var(--bg)}.definition b{font-size:calc(15px * var(--scale))}.definition p{margin:7px 0 0;color:var(--muted);font-size:calc(13px * var(--scale));line-height:1.5}
.rank-list{display:grid;gap:9px}.rank-row{display:grid;grid-template-columns:minmax(180px,1.2fr) 3fr 88px;gap:11px;align-items:center;font:600 calc(11px * var(--scale))/1.35 var(--mono)}.match-case{border-top:1px solid var(--line);padding:14px 0}.match-case:first-child{border-top:0}.match-case b{font:700 calc(15px * var(--scale))/1.3 var(--sans)}.match-case small{display:block;color:var(--muted);margin-top:5px;font:500 calc(11px * var(--scale))/1.45 var(--mono)}
@keyframes appear{from{opacity:0;transform:translateY(5px)}}@media(max-width:900px){.rail{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}.panel,.panel.third{grid-column:1/-1}.folds,.orientation{grid-template-columns:1fr}.frow{grid-template-columns:1.5fr 105px 2fr 55px}.glossary{grid-template-columns:1fr}}@media(max-width:620px){.shell{padding:16px 12px 55px}.mast{grid-template-columns:1fr}.actions{justify-content:flex-start}.rail{grid-template-columns:1fr 1fr}.match-grid{grid-template-columns:1fr}.inputs{grid-template-columns:1fr 1fr}.drift-row{grid-template-columns:1.6fr 70px 1fr}.drift-row>*:nth-child(4),.drift-row>*:nth-child(5){display:none}.model-table{font-size:11px}.model-table th:nth-child(4),.model-table td:nth-child(4){display:none}}

<body><main class="shell">
<header class="mast"><div><div class="kicker">FutScout · private research desk</div><h1>The model<br>under glass.</h1><p class="lede">A guided workspace for understanding which model works best, which football ideas it uses, why individual forecasts move, and where the evidence is still weak.</p></div><div class="actions"><a class="action" href="model-review.html">forecasts →</a><a class="action" href="index.html">analytics</a><button class="action" id="textSize" aria-label="Change text size">text: standard</button><button class="action" id="theme">light / dark</button></div></header>
<section class="rail" id="rail"></section>
<nav class="tabs" id="tabs" aria-label="Model lab sections"></nav>
<section class="view on" id="overview"></section>
<section class="view" id="validation"></section>
<section class="view" id="legitimacy"></section>
<section class="view" id="features"></section>
<section class="view" id="matches"></section>
<section class="view" id="monitoring"></section>
</main><script>
const D=window.MODEL_LAB_DATA; const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const n=(v,d=3)=>v==null?'—':Number(v).toFixed(d); const pct=v=>v==null?'—':(100*Number(v)).toFixed(1)+'%';
if(!D)document.body.innerHTML='<div class="empty">Model lab data is unavailable.</div>';else boot();
function boot(){
 const m=D.model,s=D.shadow,dr=D.drift; document.getElementById('rail').innerHTML=[['SHADOW','lifecycle','good'],[m.feature_count,'model inputs',''],[m.training_match_count.toLocaleString(),'training matches',''],[s.resolved||0,'live calls scored',s.sample_gate?.ready?'good':'warn'],[dr.current_matches||0,'current matches monitored',dr.sample_ready?'good':'warn']].map(x=>`<div class="stat"><b class="${x[2]}">${x[0]}</b><span>${x[1]}</span></div>`).join('');
 const views=[['overview','Start here'],['validation','Model tournament'],['legitimacy','Legitimacy tests'],['matches','Explain a match'],['features','Feature evidence'],['monitoring','Data health']],requested=new URLSearchParams(location.search).get('tab'),initial=views.some(v=>v[0]===requested)?requested:'overview';document.getElementById('tabs').innerHTML=views.map(v=>`<button class="tab ${v[0]===initial?'on':''}" data-view="${v[0]}">${v[1]}</button>`).join('');document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id===initial));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(e=>e.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.view).classList.add('on');const u=new URL(location);u.searchParams.set('tab',b.dataset.view);history.replaceState(null,'',u)});
 document.getElementById('theme').onclick=()=>{document.documentElement.classList.toggle('dark');try{localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')}catch(e){}};
 const sizes=['standard','large','xlarge'];let size=localStorage.getItem('labTextSize')||'standard';setSize(size);document.getElementById('textSize').onclick=()=>{size=sizes[(sizes.indexOf(size)+1)%sizes.length];setSize(size)};
 renderOverview();renderValidation();renderLegitimacy();enhanceExternalBenchmark();renderFeatures();renderMatches();renderMonitoring();
}
function setSize(size){document.documentElement.classList.remove('large','xlarge');if(size!=='standard')document.documentElement.classList.add(size);document.getElementById('textSize').textContent='text: '+size.replace('xlarge','extra large');try{localStorage.setItem('labTextSize',size)}catch(e){}}
function panel(title,stamp,body,cls=''){return `<article class="panel ${cls}"><div class="ph"><h2>${title}</h2><span>${stamp}</span></div>${body}</article>`}
function renderOverview(){const m=D.model,t=D.model_tournament,w=t.summary.find(x=>x.name===t.winner);document.getElementById('overview').innerHTML=`<div class="orientation"><article class="question"><span class="step">01 · Start here</span><b>Which model predicts best?</b><p>Open <strong>Model tournament</strong>. It compares shooting, territory, pressing and blended models on later seasons they never trained on.</p></article><article class="question"><span class="step">02 · Then inspect</span><b>Why did a match move?</b><p>Open <strong>Explain a match</strong>. Read the result probabilities first, then the directional evidence—not the raw coefficient list.</p></article><article class="question"><span class="step">03 · Finally verify</span><b>Can we trust the inputs?</b><p>Open <strong>Data health</strong>. Drift is a warning to investigate data distributions; it is not proof a feature is bad.</p></article></div><div class="grid">${panel('What the latest test says','plain-English verdict',`<div class="verdict"><span class="step">Best average across two season holdouts</span><h3>${esc(w.label)}</h3><p class="plain">${esc(w.idea)} It was the most consistent of the tested philosophies, but territory-only was close enough to remain a serious challenger.</p></div><p class="copy"><strong>Important:</strong> this does not prove shots cause wins or deserve permanent dominance. It means that, with today’s historical coverage and this model type, removing them did not improve probability accuracy across both tests.</p>`,'wide')}${panel('Current live specimen','registered shadow model',`<div class="micro">${esc(m.display_version)}</div><p class="copy">${esc(m.decision_basis)}</p><div class="metric"><span>Algorithm</span><b>${esc(m.algorithm)}</b></div><div class="metric"><span>Training seasons</span><b>${m.training_seasons.join(' · ')}</b></div><div class="metric"><span>Active inputs</span><b>${m.feature_count}</b></div>`)}${panel('Safety boundary','read only',`<div class="guard">${esc(D.guardrails.note)}<br><br>Live scoring gate: <b>${esc(D.shadow.sample_gate?.decision||'collect_more_results')}</b>. This laboratory compares and explains; it cannot promote a model.</div>`)}${panel('Three terms worth knowing','quick glossary',`<div class="glossary"><div class="definition"><b>Log loss</b><p>Grades the full probability forecast. Lower is better; confident wrong calls are punished most.</p></div><div class="definition"><b>Calibration</b><p>Checks whether 60% predictions happen roughly 60% of the time. Lower error is better.</p></div><div class="definition"><b>Coefficient</b><p>An internal model weight—not standalone feature importance or proof of causality.</p></div></div>`,'wide')}</div>`}
function renderLegitimacy(){const L=D.legitimacy,c=L.confidence.shooting_vs_territory_2526,p=L.family_permutation.rows,w=L.rolling_windows,a=L.architectures,t=L.table_backtests.summary;const importanceMax=Math.max(...p.map(x=>Math.abs(x.importance_delta)),.001);const perm=p.map((r,i)=>`<div class="rank-row"><span>${i+1}. ${esc(r.family.replaceAll('_',' '))}</span><div class="track"><span class="fill ${r.importance_delta<0?'control':''}" style="width:${Math.max(1,Math.abs(r.importance_delta)/importanceMax*100)}%"></span></div><b>${r.importance_delta>=0?'+':''}${n(r.importance_delta,4)}</b></div>`).join('');const arch=a.map((r,i)=>`<tr class="${i===0?'winner':''}"><td>${i+1}. ${esc(r.architecture)}</td><td>${n(r.log_loss,4)}</td><td>${n(r.brier,4)}</td><td>${pct(r.accuracy)}</td><td>${n(r.calibration_error,4)}</td></tr>`).join('');const windows=w.map((r,i)=>`<div class="metric"><span>${i+1}. ${esc(r.label)} · ${r.column_count} inputs</span><b>${n(r.log_loss,4)}</b></div>`).join('');const slices=L.stability.map(r=>`<tr><td>${esc(r.slice)}</td><td>${r.matches}</td><td>${n(r.log_loss,4)}</td><td>${pct(r.accuracy)}</td><td>${n(r.calibration_error,4)}</td></tr>`).join('');const tables=t.map(r=>`<div class="metric"><span>${pct(r.checkpoint)} season checkpoint</span><b class="${r.position_80pct_coverage>=.78?'good':'warn'}">${pct(r.position_80pct_coverage)} position coverage · ${n(r.mean_absolute_points_error,1)} pts MAE</b></div>`).join('');const cases=L.investigation.largest_disagreements.slice(0,8).map(r=>`<div class="match-case"><b>${esc(r.home_team)} ${esc(r.score)} ${esc(r.away_team)}</b><small>${esc(r.league)} · ${r.date} · model spread ${pct(r.maximum_philosophy_spread)}<br>Shots H/D/A ${r.shooting_probabilities.map(pct).join(' / ')} · Territory ${r.territory_probabilities.map(pct).join(' / ')}</small></div>`).join('');const errors=L.investigation.high_confidence_errors.slice(0,8).map(r=>`<div class="match-case"><b>${esc(r.home_team)} ${esc(r.score)} ${esc(r.away_team)}</b><small>${esc(r.league)} · predicted ${r.shooting_probabilities.map(pct).join(' / ')} · actual ${esc(r.actual)}</small></div>`).join('');document.getElementById('legitimacy').innerHTML=`<div class="grid">${panel('The honest verdict','evidence, not marketing',`<div class="verdict"><span class="step">Current statistical conclusion</span><h3>Shots and territory are tied</h3><p class="plain">The observed territory penalty is ${n(c.observed_delta,5)} log-loss points, but its paired 95% range runs from ${n(c.ci_95[0],5)} to ${n(c.ci_95[1],5)}. Because zero is inside that range, there is no defensible winner yet.</p></div><p class="copy">The all-feature model is different: its 95% interval is entirely worse than shooting-led. More inputs are currently hurting generalization.</p>`,'wide')}${panel('Out-of-sample family reliance','shuffle one family, keep outcomes fixed',`<p class="copy">Positive values mean predictions worsened when that whole family was scrambled. Negative values mean the family may be adding noise. This measures reliance inside the all-feature model, not causality.</p><div class="rank-list">${perm}</div>`,'wide')}${panel('Rolling-window challenge','lower is better',windows)}${panel('Architecture challenge','same shooting inputs',`<div style="overflow:auto"><table class="model-table"><thead><tr><th>Architecture</th><th>Log loss</th><th>Brier</th><th>Accuracy</th><th>Calibration</th></tr></thead><tbody>${arch}</tbody></table></div>`)}${panel('Where performance changes','league, phase and matchup slices',`<div style="overflow:auto"><table class="model-table"><thead><tr><th>Slice</th><th>N</th><th>Log loss</th><th>Accuracy</th><th>Calibration</th></tr></thead><tbody>${slices}</tbody></table></div>`,'wide')}${panel('Pipeline attacks','leakage and failure controls',`<div class="metric"><span>Suspicious post-match fields</span><b class="${L.negative_controls.suspicious_feature_names.length?'bad':'good'}">${L.negative_controls.suspicious_feature_names.length||'none'}</b></div><div class="metric"><span>Shuffled-goal log loss</span><b>${n(L.negative_controls.shuffled_goal_log_loss,4)}</b></div><div class="metric"><span>Shuffled-result log loss</span><b>${n(L.negative_controls.shuffled_result_log_loss,4)}</b></div><div class="metric"><span>Control decision</span><b class="${L.negative_controls.decision==='pass'?'good':'warn'}">${esc(L.negative_controls.decision)}</b></div><p class="copy">Randomized targets collapse toward chance, while no obvious post-match field names enter the model.</p>`)}${panel('Missing-data stress','probability resilience',L.robustness.map(r=>`<div class="metric"><span>${esc(r.family.replaceAll('_',' '))}</span><b>missing ${r.all_missing_delta>=0?'+':''}${n(r.all_missing_delta,4)} · noise ${r.ten_percent_noise_delta>=0?'+':''}${n(r.ten_percent_noise_delta,4)}</b></div>`).join(''))}${panel('Historical table backtests','nominal 80% position set',`${tables}<p class="copy">At the 25% checkpoint, only ${pct(t[0].position_80pct_coverage)} of final positions land in the advertised 80% set. That early-season table model needs wider uncertainty or stronger team-strength estimation.</p>`,'wide')}${panel('Matches where philosophies disagree','best investigation targets',cases)}${panel('Confident mistakes','audit these first',errors)}${panel('External and live proof','what remains genuinely unseen',`<div class="metric"><span>Historical odds benchmark</span><b class="warn">${esc(L.external_and_live.bookmaker_benchmark.status.replaceAll('_',' '))}</b></div><div class="metric"><span>Frozen live forecasts scored</span><b class="${L.external_and_live.live_shadow.resolved?'good':'warn'}">${L.external_and_live.live_shadow.resolved}</b></div><p class="copy">${esc(L.external_and_live.policy)}</p>`,'wide')}</div>`}
function enhanceExternalBenchmark(){const b=D.legitimacy.external_and_live.bookmaker_benchmark;if(!b||b.status!=='available')return;const target=[...document.querySelectorAll('#legitimacy .panel')].find(x=>x.querySelector('h2')?.textContent==='External and live proof');if(!target)return;target.insertAdjacentHTML('beforeend',`<div class="metric"><span>2025/26 matches reconciled</span><b class="good">${b.matched} · ${pct(b.coverage)}</b></div><div class="metric"><span>Our model log loss</span><b>${n(b.model_log_loss_on_common_matches,4)}</b></div><div class="metric"><span>Closing market log loss</span><b>${n(b.odds_log_loss,4)}</b></div><div class="metric"><span>Gap to market</span><b class="warn">+${n(b.model_delta_vs_odds,4)}</b></div>`) }
function familySummary(){const counts={};D.features.forEach(f=>counts[f.family]=(counts[f.family]||0)+1);return Object.entries(counts).map(([k,v])=>`<div class="metric"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}
function renderValidation(){const t=D.model_tournament,shoot=t.summary.find(x=>x.name==='shooting_led'),winner=t.summary[0];const rows=t.summary.map(r=>{const delta=r.delta_vs_shooting_final,cls=delta<0?'delta-better':delta>0?'delta-worse':'';return `<tr class="${r.rank===1?'winner':''}"><td><b>${r.rank}. ${esc(r.label)}</b><div class="plain">${esc(r.idea)}</div></td><td>${r.column_count}</td><td>${n(r.mean_log_loss,5)}</td><td>${n(r.final_holdout_log_loss,5)}</td><td class="${cls}">${r.name==='shooting_led'?'benchmark':`${delta>0?'+':''}${n(delta,5)}`}</td><td>${pct(r.final_holdout_accuracy)}</td></tr>`}).join('');const foldCards=Object.values(t.folds).map(f=>{const ordered=Object.entries(f.models).sort((a,b)=>a[1].log_loss-b[1].log_loss);return `<div class="fold"><span class="step">Train ${f.train_seasons.join(' + ')} · test ${f.test_season}</span><h3>${esc(ordered[0][1].label)} won this holdout</h3>${ordered.slice(0,5).map(([name,r],i)=>`<div class="metric"><span>${i+1}. ${esc(r.label)}</span><b>${n(r.log_loss,5)}</b></div>`).join('')}</div>`}).join('');const blocked=Object.entries(t.unavailable_families).map(([k,v])=>`<div class="metric"><span>${esc(k.replaceAll('_',' '))}</span><b class="warn">coverage blocked</b></div><p class="copy">${esc(v)}.</p>`).join('');document.getElementById('validation').innerHTML=`<div class="grid">${panel('How this test works','fair comparison',`<div class="explain"><strong>Every version receives the same Elo and rest context.</strong> It then receives only the feature families in its name. The shooting-led version is the benchmark—not a mandatory base. Models train on earlier seasons and are scored on a later season without seeing its results.</div><p class="copy">Primary score: log loss, because we care whether the complete win/draw/loss probabilities are honest. Accuracy is shown for context but does not decide the winner.</p>`,'wide')}${panel('Model tournament','lower log loss is better',`<div style="overflow:auto"><table class="model-table"><thead><tr><th>Model philosophy</th><th>Inputs</th><th>2-test average</th><th>25/26 holdout</th><th>vs shots on 25/26</th><th>Accuracy</th></tr></thead><tbody>${rows}</tbody></table></div><p class="copy"><strong>Read this as:</strong> ${esc(winner.label)} is the current overall winner. Negative “vs shots” values would beat the shooting benchmark on 2025/26; positive values are worse. Tiny differences should be treated as close, not decisive.</p>`,'wide')}${panel('The two chronological tests','consistency matters',`<div class="folds">${foldCards}</div>`,'wide')}${panel('What we cannot test fairly yet','coverage before cleverness',blocked||'<p class="copy">No blocked families.</p>')}${panel('Current V2 decision','separate from tournament',`<div class="metric"><span>Registered model</span><b>${esc(D.model.display_version)}</b></div><div class="metric"><span>V2 holdout average</span><b>${n(D.model.mean_log_loss,6)}</b></div><div class="metric"><span>Live stage</span><b class="good">shadow</b></div><p class="copy">The tournament is research evidence. It does not silently replace the registered V2 model.</p>`)}</div>`}
function leagueHeat(){const f=D.validation_folds[D.validation_folds.length-1],rows=Object.entries(f.by_league);return `<div class="heat"><div class="head">league</div><div class="head">accuracy</div><div class="head">log loss</div><div class="head">calibration</div><div class="head">matches</div>${rows.map(([l,x])=>`<div>${esc(l.replace('ENG-','').replace('ESP-','').replace('ITA-','').replace('GER-','').replace('FRA-',''))}</div><div class="cell" style="--heat:${x.accuracy*100}">${pct(x.accuracy)}</div><div>${n(x.log_loss,3)}</div><div>${n(x.calibration_error,3)}</div><div>${x.matches}</div>`).join('')}</div>`}
function renderFeatures(){const families=['all',...new Set(D.coefficients.map(r=>r.family))];const selected=new Set(D.features.map(f=>f.feature.replace(/^team\.|^opponent\./,'').replace(/_(3|5|10)$/,''))),queue=Object.entries(D.research_queue.catalog).map(([family,items])=>`<div class="fold"><h3>${esc(family.replaceAll('_',' '))}</h3>${items.map(x=>`<div class="metric"><span>${esc(x.replaceAll('_',' '))}</span><b class="${selected.has(x)?'good':'warn'}">${selected.has(x)?'IN V2':'RESEARCH'}</b></div>`).join('')}</div>`).join('');document.getElementById('features').innerHTML=`<div class="grid">${panel('Read this before the bars','weights are not a league table',`<div class="explain"><strong>A longer coefficient bar does not mean “this stat is most important to football.”</strong> It shows the direction and size of one standardized term inside this fitted model. Correlated features split credit, and one family appears many times because team/opponent and 3/5/10-match windows are separate inputs.</div>`,'wide')}${panel('Family footprint','descriptive, not causal',familyCoefficientSummary(),'wide')}${panel('Coefficient explorer','home-goal equation · standardized scale',`<div class="filters" id="featureFilters">${families.map((f,i)=>`<button class="chip ${i?'':'on'}" data-family="${esc(f)}">${esc(f)}</button>`).join('')}</div><div class="feature-table" id="featureRows"></div><p class="copy"><strong>Teal:</strong> raises the home-goal estimate. <strong>Orange:</strong> lowers it. Use this to debug model behavior—not to rank football concepts. The model tournament is the better test of whether a family improves predictions.</p>`,'wide')}${panel('Feature research queue','active vs awaiting reliable coverage',`<div class="folds">${queue}</div><p class="copy">xT, xG, final-third touches, sequence quality, progression and pressing remain explicit research targets. “Research” means we do not yet have sufficiently complete, comparable data across all three historical seasons—not that the idea was rejected.</p>`,'wide')}</div>`;document.querySelectorAll('#featureFilters .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#featureFilters .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderFeatureRows(b.dataset.family)});renderFeatureRows('all')}
function familyCoefficientSummary(){const sums={};D.coefficients.forEach(r=>{if(String(r.feature).startsWith('missingindicator_'))return;const x=sums[r.family]||(sums[r.family]={sum:0,count:0});x.sum+=r.magnitude;x.count++});const total=Object.values(sums).reduce((a,x)=>a+x.sum,0)||1;return `<div class="folds">${Object.entries(sums).sort((a,b)=>b[1].sum-a[1].sum).map(([family,x])=>`<div class="fold"><h3>${esc(family)}</h3><div class="metric"><span>Terms represented</span><b>${x.count}</b></div><div class="metric"><span>Share of absolute fitted weight</span><b>${pct(x.sum/total)}</b></div></div>`).join('')}</div><p class="copy">This footprint explains why a family occupies visual space; it is still not predictive importance. Compare families in <strong>Model tournament</strong> for the outcome test.</p>`}
function renderFeatureRows(family){const rows=D.coefficients.filter(r=>family==='all'||r.family===family).slice(0,80),mx=Math.max(...rows.map(r=>r.magnitude),.001);document.getElementById('featureRows').innerHTML=rows.map(r=>{const v=r.home_goal_coefficient||0,w=Math.abs(v)/mx*50,left=v<0?50-w:50;return `<div class="frow"><span>${esc(r.feature.replace('numeric__','').replace('categorical__',''))}</span><span class="family">${esc(r.family)}</span><div class="coef"><span class="${v<0?'neg':''}" style="left:${left}%;width:${w}%"></span></div><span>${v>=0?'+':''}${n(v,3)}</span></div>`}).join('')}
function renderMatches(){const opts=D.predictions.sort((a,b)=>a.date.localeCompare(b.date)).map((r,i)=>`<option value="${i}">${new Date(r.date).toLocaleDateString()} · ${esc(r.home_team)} — ${esc(r.away_team)}</option>`).join('');document.getElementById('matches').innerHTML=`<div class="grid">${panel('How to investigate a forecast','three passes',`<div class="orientation"><div class="question"><span class="step">01</span><b>Read the probabilities</b><p>They are the headline forecast. Expected goals support them but do not translate directly into one exact score.</p></div><div class="question"><span class="step">02</span><b>Read directional drivers</b><p>These show which active feature groups moved the goal balance and toward which team.</p></div><div class="question"><span class="step">03</span><b>Check actual inputs</b><p>Use the evidence ledger to spot implausible or missing values before questioning the fitted relationship.</p></div></div>`,'wide')}${panel('Forecast dissection','select a match',`<select class="select" id="matchSelect">${opts}</select><div id="matchDetail"></div>`,'wide')}</div>`;document.getElementById('matchSelect').onchange=e=>renderMatch(Number(e.target.value));renderMatch(0)}
function renderMatch(i){const r=D.predictions[i];if(!r){document.getElementById('matchDetail').innerHTML='<div class="empty">No explained predictions.</div>';return}const e=r.explanation,ps=[['HOME',r.home_win_probability],['DRAW',r.draw_probability],['AWAY',r.away_win_probability]];document.getElementById('matchDetail').innerHTML=`<div class="match-grid"><div><div class="club">${esc(r.home_team)}</div><div class="xg">${n(r.home_expected_goals,2)} xG</div></div><div><div class="club">${esc(r.away_team)}</div><div class="xg">${n(r.away_expected_goals,2)} xG</div></div></div><p class="copy">${esc(e.summary)}</p>${ps.map(p=>`<div class="prob-line"><span>${p[0]}</span><div class="track"><span class="fill" style="width:${p[1]*100}%"></span></div><b>${pct(p[1])}</b></div>`).join('')}<div class="ph" style="margin-top:22px"><h2>Evidence ledger</h2><span>actual inputs</span></div><div class="inputs">${Object.entries(e.inputs).map(([k,v])=>`<div class="input"><b>${v==null?'—':esc(v)}</b><span>${esc(k.replaceAll('_',' '))}</span></div>`).join('')}</div><div class="ph" style="margin-top:22px"><h2>Directional drivers</h2><span>goal-balance contribution</span></div>${e.drivers.map(d=>`<div class="driver"><strong>${esc(d.label)} · ${esc(d.strength)}</strong><span>${d.goal_balance_effect>=0?'+':''}${n(d.goal_balance_effect,3)}</span><p>Favors ${esc(d.favors)}. ${esc(d.detail)}</p></div>`).join('')}<p class="copy">${esc(e.method)} ${esc(e.scope)}</p>`}
function renderMonitoring(){const d=D.drift,s=D.shadow;const drift=d.features.map(r=>`<div class="drift-row"><span>${esc(r.feature)}</span><span class="tag ${r.severity}">${r.severity}</span><span>PSI ${n(r.population_stability_index,3)}</span><span>shift ${n(r.standardized_mean_shift,3)}</span><span>missing Δ ${n(r.missing_rate_change,3)}</span></div>`).join('');const leagues=Object.entries(s.by_league||{}).map(([l,x])=>`<div class="metric"><span>${esc(l)}</span><b>${x.matches||0} scored${x.log_loss!=null?' · LL '+n(x.log_loss,3):''}</b></div>`).join('');document.getElementById('monitoring').innerHTML=`<div class="grid">${panel('How to read data health','warning system, not a verdict',`<div class="explain"><strong>Start with live scoring:</strong> it tells us how forecasts perform. Then use drift to ask whether current inputs look unlike the historical training sample. PSI measures distribution change; mean shift shows direction; missing Δ reveals coverage changes.</div>`,'wide')}${panel('Live shadow score','real predictions only',`<div class="metric"><span>Resolved forecasts</span><b>${s.resolved||0}</b></div><div class="metric"><span>Still pending</span><b>${s.pending||0}</b></div><div class="metric"><span>Promotion sample gate</span><b class="${s.sample_gate?.ready?'good':'warn'}">${esc(s.sample_gate?.decision||'collect_more_results')}</b></div>${leagues||'<div class="empty">Waiting for the first eligible frozen slate to resolve.</div>'}`)}${panel('Current-season drift','investigate before trusting',`<div class="metric"><span>Decision</span><b class="${d.decision==='no_material_drift_detected'?'good':'warn'}">${esc(d.decision)}</b></div><div class="metric"><span>Current sample</span><b>${d.current_matches} matches</b></div><p class="copy">Calendar effects can legitimately differ early in a season. Severe rest-day drift is reviewed separately from football-performance drift.</p>`)}${panel('Feature drift ledger','phase-matched historical reference',`<div class="drift-row"><b>feature</b><b>status</b><b>PSI</b><b>mean shift</b><b>missing</b></div>${drift}`,'wide')}</div>`}
</script></body></html>
